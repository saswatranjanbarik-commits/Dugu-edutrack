*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0f4f8;color:#1a202c;min-height:100vh}
:root{--p:#1F4E79;--a:#C55A11;--s:#276221;--sl:#C6EFCE;--d:#9C0006;--dl:#FFC7CE;--w:#9C5700;--wl:#FFEB9C;--pu:#4B2E83}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes ripple{0%{transform:scale(0.8);opacity:1}100%{transform:scale(2);opacity:0}}
.fi{animation:fi .3s ease}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn:active{transform:scale(.97)}
.bp{background:var(--p);color:#fff}.bp:hover{background:#2E75B6}
.ba{background:var(--a);color:#fff}
.bs{background:var(--s);color:#fff}
.bpu{background:var(--pu);color:#fff}
.bo{background:transparent;border:2px solid var(--p);color:var(--p)}.bo:hover{background:var(--p);color:#fff}
.bg2{background:#f1f5f9;color:#334155}.bg2:hover{background:#e2e8f0}
.brd{background:var(--dl);color:var(--d);border:none}
.bsm{padding:6px 14px;font-size:12px}.blg{padding:14px 28px;font-size:16px}.bfw{width:100%}
.inp{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:12px;font-size:14px;font-family:inherit;outline:none;background:#fff;transition:border-color .2s}
.inp:focus{border-color:var(--p)}
.lbl{font-size:13px;font-weight:600;color:#334155;display:block;margin-bottom:6px}
.pb{height:8px;background:#e2e8f0;border-radius:9999px;overflow:hidden}
.pf{height:100%;border-radius:9999px;transition:width .5s ease}
.nav{background:var(--p);color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.sb{width:210px;background:#fff;height:calc(100vh - 60px);position:fixed;left:0;top:60px;border-right:1px solid #e2e8f0;padding:12px 0;overflow-y:auto;z-index:90}
.si{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;font-weight:500;color:#334155;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.si:hover{background:#f8fafc;color:var(--p)}
.si.act{background:#DCE6F1;color:var(--p);border-left-color:var(--p);font-weight:600}
.main{margin-left:210px;padding:24px;min-height:calc(100vh - 60px);padding-bottom:80px}
.mn{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2e8f0;z-index:100;padding:6px 0 10px}
.mi{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#64748b;cursor:pointer;padding:4px}
.mi.act{color:var(--p);font-weight:600}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pt{font-size:24px;font-weight:800;color:#0f172a;margin-bottom:4px}
.ps{font-size:14px;color:#64748b;margin-bottom:24px}
.st{font-size:16px;font-weight:700;color:#0f172a;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600}
.ts{background:var(--sl);color:var(--s)}.tw{background:var(--wl);color:var(--w)}.td2{background:var(--dl);color:var(--d)}.tp{background:#DCE6F1;color:var(--p)}.tpu{background:#E8E0F0;color:var(--pu)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-lg{max-width:800px}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:12px;background:#f8fafc;border:1px solid #e2e8f0;margin-bottom:10px}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid #e2e8f0;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;margin-top:2px}
.upload-zone{border:2px dashed #e2e8f0;border-radius:12px;padding:24px;text-align:center;cursor:pointer;transition:all .15s;background:#f8fafc}
.upload-zone:hover{border-color:var(--p);background:#f0f7ff}
.note-card{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;background:#fff}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:#f1f5f9;color:#334155}
/* Voice button */
.voice-btn{width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;transition:all .2s;position:relative}
.voice-btn.idle{background:linear-gradient(135deg,#1F4E79,#2E75B6);box-shadow:0 4px 16px rgba(31,78,121,.4)}
.voice-btn.listening{background:linear-gradient(135deg,#9C0006,#C55A11);box-shadow:0 4px 16px rgba(156,0,6,.4);animation:pulse 1s infinite}
.voice-btn.listening::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid rgba(156,0,6,.4);animation:ripple 1.5s infinite}
/* Timetable edit */
.tt-cell{padding:6px 8px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;cursor:pointer;transition:all .15s;min-height:36px;display:flex;align-items:center;justify-content:center}
.tt-cell:hover{opacity:.8;transform:scale(1.05)}
.tt-cell-edit{padding:4px;border:2px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit;outline:none;width:100%;text-align:center}
.tt-cell-edit:focus{border-color:var(--p)}
@media(max-width:768px){.main{margin-left:0;padding:16px}.sb{display:none}.mn{display:flex!important}.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
</style>

function MainApp({user}){
  const[profile,setProfile]=useState(null);
  const[page,setPage]=useState("dashboard");
  const[topics,setTopics]=useState([]);
  const[revisions,setRevisions]=useState([]);
  const[notes,setNotes]=useState([]);
  const[syllabus,setSyllabus]=useState({});
  const[calEvents,setCalEvents]=useState([]);
  const[flashcards,setFlashcards]=useState([]);
  const[quizzes,setQuizzes]=useState([]);
  const[tasks,setTasks]=useState([]);
  const[studyNotes,setStudyNotes]=useState([]);
  const[users,setUsers]=useState([]);
  const[timetable,setTimetable]=useState(DEFAULT_TT);
  const[onlineUsers,setOnlineUsers]=useState([]);
  const[toast,setToast]=useState("");
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(""),3000)};

  useEffect(()=>{
    db.collection("users").doc(user.uid).get().then(d=>{if(d.exists)setProfile(d.data());});
    db.collection("users").doc(user.uid).update({online:true});
    const uns=[];
    uns.push(db.collection("topics").orderBy("createdAt","desc").limit(100).onSnapshot(s=>setTopics(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("revisions").orderBy("dueDate","asc").onSnapshot(s=>setRevisions(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("notes").orderBy("createdAt","desc").limit(30).onSnapshot(s=>setNotes(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("syllabus").doc("shared").onSnapshot(s=>{if(s.exists)setSyllabus(s.data().data||{});}));
    uns.push(db.collection("timetable").doc("shared").onSnapshot(s=>{if(s.exists)setTimetable(s.data().data||DEFAULT_TT);}));
    uns.push(db.collection("calEvents").orderBy("date","asc").onSnapshot(s=>setCalEvents(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("flashcards").orderBy("createdAt","desc").onSnapshot(s=>setFlashcards(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("quizzes").orderBy("createdAt","desc").onSnapshot(s=>setQuizzes(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("tasks").orderBy("createdAt","desc").onSnapshot(s=>setTasks(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("studyNotes").orderBy("createdAt","desc").onSnapshot(s=>setStudyNotes(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("users").onSnapshot(s=>setUsers(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("users").where("online","==",true).onSnapshot(s=>setOnlineUsers(s.docs.map(d=>d.data().name).filter(Boolean))));
    return()=>{uns.forEach(u=>u());db.collection("users").doc(user.uid).update({online:false});};
  },[user.uid]);

  const logout=async()=>{await db.collection("users").doc(user.uid).update({online:false});await auth.signOut();};
  const isT=profile?.role==="teacher"||profile?.role==="admin";

  const logTopic=async(entry)=>{
    const rd=new Date(entry.date);rd.setDate(rd.getDate()+7);
    const rDue=rd.toISOString().split("T")[0];
    await db.collection("topics").add({...entry,revisionDue:rDue,loggedBy:profile?.name||"Teacher",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    if(entry.status==="taught"){await db.collection("revisions").add({subject:entry.subject,chapter:entry.chapter,topic:entry.topic,subtopic:entry.subtopic||"",taughtDate:entry.date,dueDate:rDue,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
    const upd=JSON.parse(JSON.stringify(syllabus));
    if(!upd[entry.subject])upd[entry.subject]={chapters:DS[entry.subject]?.chapters||[],progress:{}};
    if(!upd[entry.subject].progress)upd[entry.subject].progress={};
    const key=`${entry.subject}||${entry.chapter}||${entry.topic}${entry.subtopic?"||"+entry.subtopic:""}`;
    upd[entry.subject].progress[key]={status:entry.status,date:entry.date};
    await db.collection("syllabus").doc("shared").set({data:upd},{merge:true});
    showToast("Topic saved! Revision set for "+rDue);
  };
  const markRevised=async(id)=>{await db.collection("revisions").doc(id).update({done:true,doneDate:new Date().toISOString().split("T")[0]});showToast("Marked as revised!");};
  const addNote=async(text)=>{await db.collection("notes").add({text,author:profile?.name||"Teacher",createdAt:firebase.firestore.FieldValue.serverTimestamp()});};
  const addCalEvent=async(ev)=>{await db.collection("calEvents").add({...ev,createdBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Event added!");};
  const deleteCalEvent=async(id)=>{await db.collection("calEvents").doc(id).delete();};
  const addFlashcard=async(fc)=>{await db.collection("flashcards").add({...fc,createdBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Flashcard added!");};
  const addQuiz=async(qz)=>{await db.collection("quizzes").add({...qz,createdBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Quiz added!");};
  const addTask=async(tk)=>{await db.collection("tasks").add({...tk,createdBy:profile?.name,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Task assigned!");};
  const toggleTask=async(id,done)=>{await db.collection("tasks").doc(id).update({done:!done,doneDate:!done?new Date().toISOString().split("T")[0]:null});};
  const uploadSyllabus=async(subj,chapters)=>{const upd=JSON.parse(JSON.stringify(syllabus));if(!upd[subj])upd[subj]={};upd[subj].chapters=chapters;upd[subj].progress=upd[subj].progress||{};await db.collection("syllabus").doc("shared").set({data:upd},{merge:true});showToast("Syllabus updated!");};
  const saveTimetable=async(tt)=>{await db.collection("timetable").doc("shared").set({data:tt},{merge:true});showToast("Timetable saved!");};
  const addStudyNote=async(note)=>{await db.collection("studyNotes").add({...note,uploadedBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Study material added!");};
  const deleteStudyNote=async(id)=>{await db.collection("studyNotes").doc(id).delete();showToast("Deleted.");};

  const todayRevs=revisions.filter(r=>{const t=new Date().toISOString().split("T")[0];return!r.done&&r.dueDate<=t;});
  const navT=[{id:"dashboard",l:"Dashboard",i:"📊"},{id:"calendar",l:"Calendar",i:"📅"},{id:"log",l:"Log Topic",i:"✏️"},{id:"syllabus",l:"Syllabus",i:"📚"},{id:"studynotes",l:"Study Notes",i:"📎"},{id:"revision",l:"Revisions",i:"🔄"},{id:"notes",l:"Team Notes",i:"💬"},{id:"content",l:"Flashcards & Quiz",i:"🎯"},{id:"tasks",l:"Tasks",i:"✅"},{id:"timetable",l:"Timetable",i:"🗓️"}];
  const navC=[{id:"dashboard",l:"Dashboard",i:"🏠"},{id:"calendar",l:"Calendar",i:"📅"},{id:"syllabus",l:"My Syllabus",i:"📚"},{id:"studynotes",l:"Study Notes",i:"📎"},{id:"revision",l:"Revisions",i:"🔄"},{id:"learn",l:"Learn",i:"🎯"},{id:"tasks",l:"My Tasks",i:"✅"},{id:"voice",l:"Voice Entry",i:"🎙️"}];
  const nav=isT?navT:navC;
  const props={profile,topics,revisions,notes,syllabus,calEvents,flashcards,quizzes,tasks,studyNotes,users,timetable,onlineUsers,todayRevs,logTopic,markRevised,addNote,addCalEvent,deleteCalEvent,addFlashcard,addQuiz,addTask,toggleTask,uploadSyllabus,saveTimetable,addStudyNote,deleteStudyNote,showToast,isT};

  const renderPage=()=>{
    switch(page){
      case"dashboard":return<Dashboard {...props} setPage={setPage}/>;
      case"calendar":return<CalendarPage {...props}/>;
      case"log":return<LogTopic {...props}/>;
      case"syllabus":return<SyllabusPage {...props}/>;
      case"studynotes":return<StudyNotesPage {...props}/>;
      case"revision":return<RevisionPage {...props}/>;
      case"notes":return<NotesPage {...props}/>;
      case"content":return<ContentPage {...props}/>;
      case"learn":return<LearnPage {...props}/>;
      case"tasks":return<TasksPage {...props}/>;
      case"timetable":return<TimetablePage {...props}/>;
      case"voice":return<VoicePage {...props}/>;
      default:return<Dashboard {...props} setPage={setPage}/>;
    }
  };

  return(
    <div>
      <nav className="nav">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🎓</span>
          <span style={{fontFamily:"sans-serif",fontSize:18,fontWeight:800}}>Dugu EduTrack</span>
          <span style={{fontSize:10,background:"rgba(255,255,255,0.2)",padding:"2px 8px",borderRadius:9999,fontWeight:600}}>v3.1</span>
          {onlineUsers.length>0&&<span style={{fontSize:11,background:"rgba(34,197,94,0.2)",color:"#86efac",padding:"2px 8px",borderRadius:9999,fontWeight:600}}>{onlineUsers.length} online</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13}}>{profile?.avatar||"?"}</div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end"}}><span style={{fontWeight:700,fontSize:13}}>{profile?.name||"..."}</span><span style={{fontSize:10,opacity:.75,textTransform:"capitalize"}}>{profile?.role}</span></div>
          <button onClick={logout} style={{background:"rgba(255,255,255,0.15)",color:"white",border:"none",padding:"5px 12px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,marginLeft:6}}>Exit</button>
        </div>
      </nav>
      <div className="sb">
        <div style={{padding:"6px 16px 10px",borderBottom:"1px solid #e2e8f0",marginBottom:6,fontSize:11,fontWeight:700,color:"#64748b",letterSpacing:1}}>{isT?"TEACHER PORTAL":"STUDENT PORTAL"}</div>
        {nav.map(item=><div key={item.id} className={`si ${page===item.id?"act":""}`} onClick={()=>setPage(item.id)}><span style={{fontSize:16}}>{item.i}</span><span>{item.l}</span></div>)}
        <div style={{padding:"12px 16px",position:"absolute",bottom:0,left:0,right:0,borderTop:"1px solid #e2e8f0",fontSize:10,color:"#64748b",textAlign:"center"}}><span style={{width:6,height:6,borderRadius:"50%",background:"#22c55e",display:"inline-block",marginRight:4}}/>Live Sync · Baibhav · Std 5A</div>
      </div>
      <div className="main">{renderPage()}</div>
      <div className="mn" style={{display:"none"}}>{nav.slice(0,5).map(item=><div key={item.id} className={`mi ${page===item.id?"act":""}`} onClick={()=>setPage(item.id)}><span style={{fontSize:18}}>{item.i}</span><span>{item.l}</span></div>)}</div>
      {toast&&<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:"#1a202c",color:"#fff",padding:"10px 22px",borderRadius:9999,fontSize:13,fontWeight:500,zIndex:999,boxShadow:"0 8px 32px rgba(0,0,0,.16)",whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

// Dashboard
function Dashboard({profile,topics,todayRevs,onlineUsers,tasks,calEvents,syllabus,timetable,setPage}){
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const tn=days[new Date().getDay()];
  const ts=(timetable[tn]||[]).filter(p=>p.sub!=="BREAK");
  const todayStr=new Date().toISOString().split("T")[0];
  const todayEvents=calEvents.filter(e=>e.date===todayStr);
  const pendingTasks=tasks.filter(t=>!t.done).length;
  const totalTopics=Object.values(DS).reduce((s,v)=>s+v.chapters.reduce((a,c)=>a+c.topics.reduce((b,t)=>b+1+(t.subtopics?.length||0),0),0),0);
  const taughtTopics=Object.values(syllabus).reduce((s,v)=>s+Object.keys(v.progress||{}).filter(k=>v.progress[k].status==="taught").length,0);
  const overallPct=totalTopics?Math.round(taughtTopics/totalTopics*100):0;
  const tutorSlots=calEvents.filter(e=>(e.type==="tutor"||e.type==="meeting")&&e.date>=todayStr).slice(0,2);
  return(
    <div className="fi">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div className="pt">Welcome, {profile?.name||"..."}! 👋</div>
        {onlineUsers.length>0&&<div style={{background:"#C6EFCE",color:"#276221",padding:"5px 12px",borderRadius:9999,fontSize:12,fontWeight:600}}><span style={{width:6,height:6,borderRadius:"50%",background:"#22c55e",display:"inline-block",marginRight:4}}/>Online: {onlineUsers.join(", ")}</div>}
      </div>
      <div className="ps">{new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
      <div className="g4" style={{marginBottom:20}}>
        {[{v:topics.length,l:"Topics Taught",c:"#1F4E79",i:"📚"},{v:todayRevs.length,l:"Revisions Due",c:"#C55A11",i:"🔄"},{v:pendingTasks,l:"Pending Tasks",c:"#4B2E83",i:"✅"},{v:overallPct+"%",l:"Overall Progress",c:"#276221",i:"📈"}].map((s,i)=>(
          <div key={i} className="card" style={{borderTop:`4px solid ${s.c}`}}>
            <div style={{fontSize:22,marginBottom:4}}>{s.i}</div>
            <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:12,color:"#64748b",fontWeight:500}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div className="g2" style={{marginBottom:20}}>
        <div className="card">
          <div className="st">🗓️ Today — {tn}</div>
          {ts.length>0?<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>{ts.map((p,i)=><span key={i} style={{padding:"4px 10px",borderRadius:9999,fontSize:12,fontWeight:600,background:p.color||"#DCE6F1",color:"#334155"}}>P{i+1}: {p.sub}</span>)}</div>:<p style={{color:"#64748b",fontSize:13,marginBottom:12}}>No school today!</p>}
          {todayEvents.length>0&&<div style={{borderTop:"1px solid #e2e8f0",paddingTop:10,marginBottom:10}}>{todayEvents.map(e=><div key={e.id} style={{fontSize:13,padding:"4px 0",color:"#334155"}}>• {e.title}{e.time?" at "+e.time:""}{e.meetLink&&<a href={e.meetLink} target="_blank" style={{marginLeft:8,color:"#1F4E79",fontSize:11,fontWeight:600}}>Join →</a>}</div>)}</div>}
          <button onClick={()=>setPage("log")} style={{width:"100%",padding:"8px",background:"#1F4E79",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>✏️ Log Today Topics</button>
        </div>
        <div className="card">
          <div className="st">📊 Subject Progress</div>
          {SUBS.slice(0,5).map(sub=>{
            const allT=DS[sub].chapters.reduce((a,c)=>a+c.topics.reduce((b,t)=>b+1+(t.subtopics?.length||0),0),0);
            const done=Object.keys(syllabus[sub]?.progress||{}).filter(k=>syllabus[sub].progress[k].status==="taught").length;
            const pct=allT?Math.round(done/allT*100):0;
            return(<div key={sub} style={{marginBottom:10}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:12,fontWeight:600}}>{sub}</span><span style={{fontSize:11,color:"#64748b"}}>{done}/{allT} · {pct}%</span></div><div className="pb"><div className="pf" style={{width:`${pct}%`,background:SC[sub]||"#1F4E79"}}/></div></div>);
          })}
          <button onClick={()=>setPage("syllabus")} style={{marginTop:8,width:"100%",padding:"6px",background:"transparent",color:"#1F4E79",border:"1px solid #1F4E79",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>View All →</button>
        </div>
      </div>
      <div className="g2">
        <div className="card">
          <div className="st">🔄 Revisions Due {todayRevs.length>0&&<span className="tag td2" style={{marginLeft:6}}>{todayRevs.length}</span>}</div>
          {todayRevs.length===0?<p style={{color:"#64748b",fontSize:13,textAlign:"center",padding:"16px 0"}}>No revisions due today!</p>:todayRevs.slice(0,4).map(r=>(
            <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0",marginBottom:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#C55A11",flexShrink:0}}/>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{r.subject}</div><div style={{fontSize:11,color:"#64748b"}}>{r.topic}</div></div>
              <span className="tag tw">Due</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="st">📹 Tutor Sessions</div>
          {tutorSlots.length===0?<div style={{textAlign:"center",padding:"16px 0",color:"#64748b",fontSize:13}}><div style={{fontSize:32,marginBottom:8}}>📹</div>No sessions scheduled.<br/><button onClick={()=>setPage("calendar")} style={{marginTop:8,background:"none",border:"none",color:"#1F4E79",cursor:"pointer",fontSize:12,fontWeight:600,textDecoration:"underline"}}>Schedule one →</button></div>:tutorSlots.map(e=>(
            <div key={e.id} style={{padding:"12px 14px",borderRadius:10,background:"#E8E0F0",border:"1px solid #4B2E83",marginBottom:8}}>
              <div style={{fontSize:13,fontWeight:700,color:"#4B2E83"}}>{e.title}</div>
              <div style={{fontSize:12,color:"#64748b"}}>{e.date}{e.time?" at "+e.time:""}</div>
              {e.meetLink&&<a href={e.meetLink} target="_blank" style={{display:"inline-block",marginTop:6,padding:"4px 12px",background:"#4B2E83",color:"white",borderRadius:8,fontSize:12,fontWeight:600,textDecoration:"none"}}>📹 Join Meeting</a>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// FEATURE 1: Editable Timetable
function TimetablePage({timetable,saveTimetable,isT,showToast}){
  const[editMode,setEditMode]=useState(false);
  const[editTT,setEditTT]=useState(null);
  const[saving,setSaving]=useState(false);
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const todayName=days[new Date().getDay()];

  const startEdit=()=>{setEditTT(JSON.parse(JSON.stringify(timetable)));setEditMode(true);};
  const cancelEdit=()=>{setEditTT(null);setEditMode(false);};

  const updateCell=(day,idx,value)=>{
    setEditTT(prev=>{
      const upd=JSON.parse(JSON.stringify(prev));
      if(!upd[day])upd[day]=[];
      upd[day][idx]={sub:value,color:TT_COLORS[value]||"#f1f5f9"};
      return upd;
    });
  };

  const addPeriod=(day)=>{
    setEditTT(prev=>{
      const upd=JSON.parse(JSON.stringify(prev));
      if(!upd[day])upd[day]=[];
      upd[day].push({sub:"New",color:"#f1f5f9"});
      return upd;
    });
  };

  const removePeriod=(day,idx)=>{
    setEditTT(prev=>{
      const upd=JSON.parse(JSON.stringify(prev));
      upd[day].splice(idx,1);
      return upd;
    });
  };

  const saveEdit=async()=>{
    setSaving(true);
    await saveTimetable(editTT);
    setSaving(false);
    setEditMode(false);
    setEditTT(null);
  };

  const resetDefault=async()=>{
    if(!window.confirm("Reset to default timetable?"))return;
    setSaving(true);
    await saveTimetable(DEFAULT_TT);
    setSaving(false);
    showToast("Timetable reset to default!");
  };

  const displayTT=editMode?editTT:timetable;

  return(
    <div className="fi">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div className="pt">🗓️ School Timetable</div>
        {isT&&(
          <div style={{display:"flex",gap:8}}>
            {!editMode?(
              <>
                <button className="btn bp bsm" onClick={startEdit}>✏️ Edit Timetable</button>
                <button className="btn bg2 bsm" onClick={resetDefault}>↺ Reset Default</button>
              </>
            ):(
              <>
                <button className="btn bg2 bsm" onClick={cancelEdit}>Cancel</button>
                <button className="btn bs bsm" onClick={saveEdit} disabled={saving}>{saving?"Saving...":"💾 Save Timetable"}</button>
              </>
            )}
          </div>
        )}
      </div>
      <div className="ps">Buxi Jagabandhu English Medium School-II · Std 5A · Mrs. Tarulata Mohanty{editMode&&<span style={{color:"#C55A11",fontWeight:600}}> — EDIT MODE</span>}</div>

      {editMode&&(
        <div style={{background:"#FFF2CC",border:"2px solid #9C5700",borderRadius:12,padding:"12px 16px",marginBottom:20,fontSize:13,color:"#9C5700"}}>
          ✏️ <strong>Edit Mode:</strong> Click any subject name to change it. Use the + button to add periods, ✕ to remove. Click "Save Timetable" when done.
        </div>
      )}

      <div style={{background:"white",borderRadius:16,boxShadow:"0 4px 16px rgba(0,0,0,.12)",overflow:"auto",marginBottom:20}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:700}}>
          <thead>
            <tr>
              <th style={{padding:"12px 16px",background:"#1F4E79",color:"white",fontSize:13,fontWeight:700,textAlign:"left",minWidth:90}}>Day</th>
              {PERIODS.map((p,i)=><th key={i} style={{padding:"10px 8px",background:"#1F4E79",color:"white",fontSize:11,fontWeight:600,textAlign:"center",minWidth:90}}>{p}</th>)}
              {editMode&&<th style={{padding:"10px 8px",background:"#1F4E79",color:"white",fontSize:11,fontWeight:600,textAlign:"center",minWidth:60}}>Add</th>}
            </tr>
          </thead>
          <tbody>
            {DAYS_LIST.map(day=>{
              const periods=displayTT[day]||[];
              return(
                <tr key={day} style={{background:day===todayName?"#FFFDE7":"white"}}>
                  <td style={{padding:"10px 16px",fontWeight:700,fontSize:13,borderRight:"2px solid #e2e8f0",borderBottom:"1px solid #e2e8f0"}}>
                    {day===todayName&&<span style={{fontSize:10,background:"#C55A11",color:"white",padding:"1px 6px",borderRadius:9999,marginRight:6,fontWeight:700}}>TODAY</span>}
                    {day}
                  </td>
                  {periods.map((p,i)=>(
                    <td key={i} style={{padding:"6px",textAlign:"center",borderBottom:"1px solid #e2e8f0",borderRight:"1px solid #e2e8f0",minWidth:90}}>
                      {editMode?(
                        <div style={{position:"relative"}}>
                          <input
                            className="tt-cell-edit"
                            value={p.sub}
                            onChange={e=>updateCell(day,i,e.target.value)}
                            style={{background:TT_COLORS[p.sub]||"#f1f5f9"}}
                          />
                          {p.sub!=="BREAK"&&<button onClick={()=>removePeriod(day,i)} style={{position:"absolute",top:-6,right:-6,width:16,height:16,borderRadius:"50%",background:"#9C0006",color:"white",border:"none",cursor:"pointer",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>✕</button>}
                        </div>
                      ):(
                        <span className="tt-cell" style={{background:TT_COLORS[p.sub]||"#f1f5f9",color:"#334155",display:"block"}}>{p.sub}</span>
                      )}
                    </td>
                  ))}
                  {/* Empty cells for alignment */}
                  {periods.length<PERIODS.length&&Array(PERIODS.length-periods.length).fill(null).map((_,i)=>(
                    <td key={"empty"+i} style={{borderBottom:"1px solid #e2e8f0",borderRight:"1px solid #e2e8f0"}}/>
                  ))}
                  {editMode&&<td style={{padding:"6px",textAlign:"center",borderBottom:"1px solid #e2e8f0"}}><button onClick={()=>addPeriod(day)} style={{width:28,height:28,borderRadius:"50%",background:"#1F4E79",color:"white",border:"none",cursor:"pointer",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto"}}>+</button></td>}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {/* Subject color legend */}
      <div className="card">
        <div className="st">Subject Color Guide</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
          {Object.entries(TT_COLORS).filter(([k])=>k!=="BREAK").map(([sub,color])=>(
            <span key={sub} style={{padding:"4px 12px",borderRadius:9999,fontSize:12,fontWeight:600,background:color,color:"#334155"}}>{sub}</span>
          ))}
        </div>
        {isT&&!editMode&&<div style={{marginTop:12,fontSize:12,color:"#64748b"}}>💡 Click "Edit Timetable" to modify subjects, add or remove periods for any day.</div>}

}

// FEATURE 2: Voice Entry for Baibhav
function VoicePage({logTopic,syllabus,profile,showToast}){
  const[listening,setListening]=useState(false);
  const[transcript,setTranscript]=useState("");
  const[parsed,setParsed]=useState(null);
  const[saving,setSaving]=useState(false);
  const[supported,setSupported]=useState(true);
  const[history,setHistory]=useState([]);
  const recogRef=useRef(null);

  useEffect(()=>{
    if(!("webkitSpeechRecognition" in window)&&!("SpeechRecognition" in window)){
      setSupported(false);
    }
  },[]);

  const startListening=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setSupported(false);return;}
    const recog=new SR();
    recog.continuous=true;
    recog.interimResults=true;
    recog.lang="en-IN";
    recog.onresult=(e)=>{
      let final="";let interim="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal)final+=e.results[i][0].transcript;
        else interim+=e.results[i][0].transcript;
      }
      setTranscript(prev=>prev+final+(interim?" ["+interim+"]":""));
    };
    recog.onerror=(e)=>{setListening(false);showToast("Voice error: "+e.error);};
    recog.onend=()=>setListening(false);
    recogRef.current=recog;
    recog.start();
    setListening(true);
    setTranscript("");
    setParsed(null);
  };

  const stopListening=()=>{
    recogRef.current?.stop();
    setListening(false);
  };

  // Parse voice transcript into topic entry
  const parseTranscript=()=>{
    const text=transcript.replace(/\[.*?\]/g,"").trim();
    if(!text){showToast("No speech detected. Try again!");return;}
    // Try to extract subject, chapter, topic from speech
    const subjectMap={english:"English",hindi:"Hindi",odia:"Odia",maths:"Mathematics",mathematics:"Mathematics",science:"Science","social studies":"Social Studies","social":"Social Studies",computer:"Computer Science","moral science":"Moral Science","general knowledge":"General Knowledge",gk:"General Knowledge"};
    let detectedSubject="";
    const lowerText=text.toLowerCase();
    for(const[key,val] of Object.entries(subjectMap)){
      if(lowerText.includes(key)){detectedSubject=val;break;}
    }
    // Extract chapter
    const chMatch=text.match(/chapter\s+(\d+|[a-z]+)|ch[\s-]?(\d+)/i);
    const chapter=chMatch?`Ch-${chMatch[1]||chMatch[2]}`:"";
    // Extract topic keywords
    const topicMatch=text.match(/(?:about|studied|covered|did|topic|lesson)\s+(.+?)(?:\.|$)/i);
    const topic=topicMatch?topicMatch[1].trim():text.slice(0,50);
    setParsed({subject:detectedSubject,chapter,topic,notes:text,date:new Date().toISOString().split("T")[0],status:"taught",subjectId:detectedSubject.toLowerCase().replace(/ /g,"_")});
  };

  const saveEntry=async()=>{
    if(!parsed||!parsed.subject||!parsed.topic)return;
    setSaving(true);
    await logTopic(parsed);
    setHistory(h=>[{...parsed,id:Date.now(),...{savedAt:new Date().toLocaleTimeString("en-IN")}}, ...h.slice(0,4)]);
    setSaving(false);
    setTranscript("");
    setParsed(null);
    showToast("Voice entry saved!");
  };

  return(
    <div className="fi">
      <div className="pt">🎙️ Voice Entry</div>
      <div className="ps">Speak to log what you studied today — Baibhav's easy update!</div>

      {!supported?(
        <div className="card" style={{textAlign:"center",padding:"40px 20px"}}>
          <div style={{fontSize:48,marginBottom:12}}>😔</div>
          <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>Voice not supported</div>
          <p style={{color:"#64748b",fontSize:14}}>Please use Chrome or Edge browser for voice input.</p>
        </div>
      ):(
        <>
          {/* Voice button */}
          <div className="card" style={{textAlign:"center",padding:"32px 20px",marginBottom:20}}>
            <div style={{marginBottom:20}}>
              <button className={`voice-btn ${listening?"listening":"idle"}`} onClick={listening?stopListening:startListening}>
                {listening?"🔴":"🎙️"}
              </button>
            </div>
            <div style={{fontSize:16,fontWeight:700,marginBottom:8,color:listening?"#9C0006":"#1F4E79"}}>
              {listening?"Listening... Speak now!":"Tap to Start Speaking"}
            </div>
            <div style={{fontSize:13,color:"#64748b",marginBottom:16}}>
              {listening?"Say what you studied today. Tap again to stop.":"Say something like: 'Today I studied English Chapter 3 Adventure in the Andamans'"}
            </div>

            {/* Example phrases */}
            {!listening&&!transcript&&(
              <div style={{background:"#f8fafc",borderRadius:12,padding:16,textAlign:"left"}}>
                <div style={{fontSize:12,fontWeight:700,color:"#64748b",marginBottom:8}}>💡 Example phrases:</div>
                {["Today I studied Maths Chapter 1 Large Numbers","In English class we covered Nouns grammar","Science class was about Our Body digestive system","Hindi Chapter 2 Do Gauraiyaan was taught today"].map((ex,i)=>(
                  <div key={i} onClick={()=>setTranscript(ex)} style={{fontSize:12,color:"#1F4E79",padding:"4px 0",cursor:"pointer",borderBottom:"1px solid #f1f5f9"}}>
                    🗣️ "{ex}"
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Transcript */}
          {transcript&&(
            <div className="card" style={{marginBottom:16}}>
              <div className="st">📝 What I Heard:</div>
              <div style={{background:"#f8fafc",borderRadius:10,padding:14,fontSize:14,color:"#334155",lineHeight:1.6,marginBottom:14,minHeight:60,border:"1px solid #e2e8f0"}}>
                {transcript.replace(/\[.*?\]/g,"").trim()||<span style={{color:"#94a3b8"}}>Listening...</span>}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn bg2" style={{flex:1}} onClick={()=>{setTranscript("");setParsed(null);}}>Clear</button>
                <button className="btn bp" style={{flex:1}} onClick={parseTranscript} disabled={!transcript.trim()}>Parse & Review</button>
              </div>
            </div>
          )}

          {/* Parsed entry */}
          {parsed&&(
            <div className="card" style={{marginBottom:16,border:"2px solid #276221"}}>
              <div className="st" style={{color:"#276221"}}>✅ Parsed Entry — Review & Save</div>
              <div className="g2" style={{marginBottom:12}}>
                <div>
                  <label className="lbl">Subject</label>
                  <select className="inp" style={{appearance:"none"}} value={parsed.subject} onChange={e=>setParsed(p=>({...p,subject:e.target.value}))}>
                    <option value="">-- Select --</option>
                    {SUBS.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                </div>
                <div>
                  <label className="lbl">Date</label>
                  <input className="inp" type="date" value={parsed.date} onChange={e=>setParsed(p=>({...p,date:e.target.value}))}/>
                </div>
              </div>
              <div style={{marginBottom:12}}>
                <label className="lbl">Chapter (detected)</label>
                <input className="inp" value={parsed.chapter} onChange={e=>setParsed(p=>({...p,chapter:e.target.value}))} placeholder="e.g. Ch-1"/>
              </div>
              <div style={{marginBottom:12}}>
                <label className="lbl">Topic (detected)</label>
                <input className="inp" value={parsed.topic} onChange={e=>setParsed(p=>({...p,topic:e.target.value}))} placeholder="What was taught"/>
              </div>
              <div style={{marginBottom:16}}>
                <label className="lbl">Notes (full transcript)</label>
                <textarea className="inp" rows={2} value={parsed.notes} onChange={e=>setParsed(p=>({...p,notes:e.target.value}))} style={{resize:"none"}}/>
              </div>
              <div style={{display:"flex",gap:8}}>
                <button className="btn bg2" style={{flex:1}} onClick={()=>setParsed(null)}>Edit Again</button>
                <button className="btn bs" style={{flex:1}} onClick={saveEntry} disabled={saving||!parsed.subject||!parsed.topic}>{saving?"Saving...":"💾 Save Entry"}</button>
              </div>
            </div>
          )}

          {/* History */}
          {history.length>0&&(
            <div className="card">
              <div className="st">📋 Recent Voice Entries</div>
              {history.map(h=>(
                <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:8,background:"#C6EFCE",border:"1px solid #276221",marginBottom:6}}>
                  <span style={{fontSize:16}}>🎙️</span>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:"#276221"}}>{h.subject} — {h.topic}</div><div style={{fontSize:11,color:"#276221"}}>Saved at {h.savedAt}</div></div>
                  <span className="tag ts">Saved</span>
                </div>
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

// Log Topic with dropdowns
function LogTopic({logTopic,syllabus,profile}){
  const[form,setForm]=useState({date:new Date().toISOString().split("T")[0],subject:"",chapter:"",topic:"",subtopic:"",duration:40,notes:"",status:"taught"});

  const submit=async()=>{const tl=entries.length>0?entries:[form];if(!tl[0].subject||!tl[0].chapter||!tl[0].topic)return;setSaving(true);for(const e of tl)await logTopic(e);setSaving(false);setOk(true);setEntries([]);setForm({date:new Date().toISOString().split("T")[0],subject:"",chapter:"",topic:"",subtopic:"",duration:40,notes:"",status:"taught"});setTimeout(()=>setOk(false),3000);};
  return(<div className="fi"><div className="pt">✏️ Log Today Topics</div><div className="ps">Select subject → chapter → topic → sub-topic from syllabus</div>{ok&&<div style={{background:"#C6EFCE",color:"#276221",padding:"12px 18px",borderRadius:12,marginBottom:20,fontWeight:600,fontSize:14}}>✅ Topics saved! Revision reminders set automatically.</div>}<div className="g2"><div className="card"><div className="st">📝 Add Topic Entry</div><div className="g2" style={{marginBottom:14}}><div><label className="lbl">Date</label><input className="inp" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div><div><label className="lbl">Status</label><select className="inp" style={{appearance:"none"}} value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}><option value="taught">✅ Taught</option><option value="missed">⚠️ Missed</option><option value="partial">🔶 Partial</option></select></div></div><div style={{marginBottom:14}}><label className="lbl">Subject *</label><select className="inp" style={{appearance:"none"}} value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value,chapter:"",topic:"",subtopic:""}))}><option value="">-- Select Subject --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div style={{marginBottom:14}}><label className="lbl">Chapter *</label><select className="inp" style={{appearance:"none"}} value={form.chapter} onChange={e=>setForm(f=>({...f,chapter:e.target.value,topic:"",subtopic:""}))} disabled={!form.subject}><option value="">-- Select Chapter --</option>{subChs.map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select></div><div style={{marginBottom:14}}><label className="lbl">Topic *</label><select className="inp" style={{appearance:"none"}} value={form.topic} onChange={e=>setForm(f=>({...f,topic:e.target.value,subtopic:""}))} disabled={!form.chapter}><option value="">-- Select Topic --</option>{chTps.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></div><div style={{marginBottom:14}}><label className="lbl">Sub-topic (optional)</label><select className="inp" style={{appearance:"none"}} value={form.subtopic} onChange={e=>setForm(f=>({...f,subtopic:e.target.value}))} disabled={!form.topic}><option value="">-- Select Sub-topic --</option>{tpSts.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div className="g2" style={{marginBottom:14}}><div><label className="lbl">Duration (min)</label><input className="inp" type="number" min={10} max={120} value={form.duration} onChange={e=>setForm(f=>({...f,duration:+e.target.value}))}/></div><div><label className="lbl">Logged by</label><input className="inp" value={profile?.name||"Teacher"} disabled style={{background:"#f8fafc",color:"#64748b"}}/></div></div><div style={{marginBottom:16}}><label className="lbl">Class Notes</label><textarea className="inp" rows={3} placeholder="What was covered? Observations? Homework?" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} style={{resize:"vertical"}}/></div><div style={{display:"flex",gap:8}}><button className="btn bo" style={{flex:1}} onClick={addEntry} disabled={!form.subject||!form.chapter||!form.topic}>+ Add Another</button><button className="btn bp" style={{flex:1}} onClick={submit} disabled={!form.subject||!form.chapter||!form.topic||saving}>{saving?"Saving...":"Save "+(entries.length>0?`All (${entries.length+1})`:"Topic")}</button></div></div><div style={{display:"flex",flexDirection:"column",gap:16}}>{entries.length>0&&<div className="card"><div className="st">📋 Queued ({entries.length})</div>{entries.map(e=><div key={e.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0",marginBottom:8}}><div style={{width:8,height:8,borderRadius:"50%",background:e.status==="taught"?"#276221":"#9C0006",flexShrink:0,marginTop:4}}/><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{e.subject}</div><div style={{fontSize:12,color:"#64748b"}}>{e.chapter} → {e.topic}{e.subtopic?" → "+e.subtopic:""}</div></div><button onClick={()=>setEntries(p=>p.filter(x=>x.id!==e.id))} style={{background:"none",border:"none",cursor:"pointer",color:"#9C0006",fontSize:14}}>✕</button></div>)}</div>}<div className="card" style={{background:"linear-gradient(135deg,#1F4E79,#2E75B6)",color:"white"}}><div style={{fontSize:15,fontWeight:700,marginBottom:10}}>How It Works</div><div style={{fontSize:13,lineHeight:1.8,opacity:.9}}>1. Select Subject<br/>2. Chapter auto-loads<br/>3. Topic auto-loads<br/>4. Sub-topic auto-loads<br/>5. Add class notes<br/>6. Save — progress updates instantly</div></div></div></div></div>);

function SyllabusPage({syllabus,uploadSyllabus,isT}){

ne=(t.subtopics||[]).filter(st=>progress[`${tk}||${st}`]?.status==="taught").length;return a+(progress[tk]?.status==="taught"?1:0)+stDone;},0);const chP=chAll?Math.round(chDone/chAll*100):0;const isExp=expandedCh[ch.ch]!==false;return(<div key={ch.ch} style={{marginBottom:12,border:"1px solid #e2e8f0",borderRadius:12,overflow:"hidden"}}><div style={{padding:"10px 14px",background:"#f8fafc",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}} onClick={()=>toggleCh(ch.ch)}><div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>{isExp?"▼":"▶"}</span><span style={{fontWeight:700,fontSize:14,color:SC[selSub]||"#1F4E79"}}>{ch.ch}</span></div><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:80}}><div className="pb" style={{height:6}}><div className="pf" style={{width:`${chP}%`,background:SC[selSub]||"#1F4E79"}}/></div></div><span style={{fontSize:12,fontWeight:600,color:SC[selSub]||"#1F4E79"}}>{chP}%</span></div></div>{isExp&&<div style={{padding:"8px 14px"}}>{ch.topics.map(tp=>{const tpKey=`${selSub}||${ch.ch}||${tp.name}`;const tpSt=progress[tpKey]?.status;return(<div key={tp.name} style={{marginBottom:8}}><div style={{display:"flex",alignItems:"center",gap:10,padding:"6px 8px",borderRadius:8,background:tpSt==="taught"?SL[selSub]||"#f8fafc":"#f8fafc",border:`1px solid ${tpSt==="taught"?(SC[selSub]||"#1F4E79")+"33":"#e2e8f0"}`}}><div style={{width:20,height:20,borderRadius:"50%",background:tpSt==="taught"?(SC[selSub]||"#1F4E79"):"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:tpSt==="taught"?"white":"#64748b",flexShrink:0,fontWeight:700}}>{tpSt==="taught"?"✓":"○"}</div><span style={{fontSize:13,flex:1,fontWeight:tpSt==="taught"?600:400,color:tpSt==="taught"?(SC[selSub]||"#1F4E79"):"#334155"}}>{tp.name}</span><span className={`tag ${tpSt==="taught"?"ts":"tp"}`}>{tpSt==="taught"?"Done":"Pending"}</span></div>{(tp.subtopics||[]).length>0&&<div style=   const handleFile=async(e)=>{
    const file=e.target.files[0];

      setUploading(true);setUploadProgress(0);

utton></div></div></div>)}</div>);

function ContentPage({flashcards,quizzes,tasks,addFlashcard,addQuiz,addTask,isT,showToast}){
  const[tab,setTab]=useState("flashcards");const[showModal,setShowModal]=useState(null);const[showBulk,setShowBulk]=useState(null);
  const[fcForm,setFcForm]=useState({subject:"",chapter:"",topic:"",subtopic:"",question:"",answer:"",hint:""});
  const[qzForm,setQzForm]=useState({subject:"",chapter:"",topic:"",subtopic:"",question:"",options:["","","",""],correct:0,explanation:""});
  const[tkForm,setTkForm]=useState({title:"",subject:"",description:"",dueDate:"",priority:"medium"});
  const[bulkText,setBulkText]=useState("");const[bulkSub,setBulkSub]=useState({subject:"",chapter:"",topic:"",subtopic:""});const[bulkParsed,setBulkParsed]=useState([]);
  const saveFC=async()=>{if(!fcForm.question||!fcForm.answer)return;await addFlashcard(fcForm);setFcForm({subject:"",chapter:"",topic:"",subtopic:"",question:"",answer:"",hint:""});setShowModal(null);};
  const saveQZ=async()=>{if(!qzForm.question||(qzForm.options||[]).some(o=>!o))return;await addQuiz(qzForm);setQzForm({subject:"",chapter:"",topic:"",subtopic:"",question:"",options:["","","",""],correct:0,explanation:""});setShowModal(null);};
  const saveTK=async()=>{if(!tkForm.title)return;await addTask(tkForm);setTkForm({title:"",subject:"",description:"",dueDate:"",priority:"medium"});setShowModal(null);};
  const parseBulk=()=>{const lines=bulkText.trim().split("\n").filter(l=>l.trim());if(showBulk==="fc"){const parsed=lines.map(l=>{const parts=l.split("|");return{question:(parts[0]||"").trim(),answer:(parts[1]||"").trim(),hint:(parts[2]||"").trim()};}).filter(p=>p.question&&p.answer);setBulkParsed(parsed);}else{const parsed=[];let cur=null;lines.forEach(l=>{if(l.startsWith("Q:")){if(cur)parsed.push(cur);cur={question:l.slice(2).trim(),options:[],correct:0,explanation:""};} else if(l.startsWith("*A:")&&cur){cur.options.push(l.slice(3).trim());cur.correct=cur.options.length-1;} else if(l.startsWith("A:")&&cur){cur.options.push(l.slice(2).trim());} else if(l.startsWith("E:")&&cur){cur.explanation=l.slice(2).trim();}});if(cur)parsed.push(cur);setBulkParsed(parsed.filter(p=>p.question&&p.options.length>=2));}};
  const saveBulk=async()=>{for(const item of bulkParsed){if(showBulk==="fc")await addFlashcard({...bulkSub,...item});else await addQuiz({...bulkSub,...item});}setBulkText("");setBulkParsed([]);setShowBulk(null);showToast(`${bulkParsed.length} items added!`);};

one",fontSize:12}} value={bulkSub.topic} onChange={e=>setBulkSub(f=>({...f,topic:e.target.value,subtopic:""}))} disabled={!bulkSub.chapter}><option value="">Topic</option>{(bulkSub.chapter?(DS[bulkSub.subject]?.chapters||[]).find(c=>c.ch===bulkSub.chapter)?.topics||[]:[]).map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select><select className="inp" style={{appearance:"none",fontSize:12}} value={bulkSub.subtopic} onChange={e=>setBulkSub(f=>({...f,subtopic:e.target.value}))} disabled={!bulkSub.topic}><option value="">Sub-topic</option>{(bulkSub.topic?(DS[bulkSub.subject]?.chapters||[]).find(c=>c.ch===bulkSub.chapter)?.topics?.find(t=>t.name===bulkSub.topic)?.subtopics||[]:[]).map(s=><option key={s} value={s}>{s}</option>)}</select></div></div><div style={{marginBottom:12}}><label className="lbl">Paste your content here:</label><textarea className="inp" rows={8} placeholder={showBulk==="fc"?"Question | Answer | Hint\n...":"Q: Question\nA: Option\n*A: Correct Option\n..."} value={bulkText} onChange={e=>setBulkText(e.target.value)} style={{resize:"vertical",fontFamily:"monospace",fontSize:13}}/></div><button className="btn bg2 bsm" style={{marginBottom:12}} onClick={parseBulk} disabled={!bulkText.trim()}>Preview ({bulkParsed.length} items parsed)</button>{bulkParsed.length>0&&<div style={{maxHeight:200,overflowY:"auto",border:"1px solid #e2e8f0",borderRadius:10,padding:10,marginBottom:12}}>{bulkParsed.map((item,i)=><div key={i} style={{padding:"6px 10px",borderRadius:8,background:"#f8fafc",marginBottom:6,fontSize:12}}><div style={{fontWeight:600}}>{i+1}. {item.question}</div><div style={{color:"#276221",marginTop:2}}>{showBulk==="fc"?"Answer: "+item.answer:"Options: "+(item.options||[]).join(" | ")}</div></div>)}</div>}<div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowBulk(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveBulk} disabled={bulkParsed.length===0}>Save {bulkParsed.length} Items</button></div></div></div>}
  {showModal==="fc"&&<div className="modal-bg" onClick={()=>setShowModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Create Flashcard</h3><button onClick={()=>setShowModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div><div className="g2" style={{marginBottom:12}}><div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={fcForm.subject} onChange={e=>setFcForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div><label className="lbl">Topic</label><input className="inp" placeholder="Topic name" value={fcForm.topic} onChange={e=>setFcForm(f=>({...f,topic:e.target.value}))}/></div></div><div style={{marginBottom:12}}><label className="lbl">Question / Front *</label><textarea className="inp" rows={2} placeholder="What is the question or term?" value={fcForm.question} onChange={e=>setFcForm(f=>({...f,question:e.target.value}))} style={{resize:"none"}}/></div><div style={{marginBottom:12}}><label className="lbl">Answer / Back *</label><textarea className="inp" rows={2} placeholder="What is the answer?" value={fcForm.answer} onChange={e=>setFcForm(f=>({...f,answer:e.target.value}))} style={{resize:"none"}}/></div><div style={{marginBottom:18}}><label className="lbl">Hint (optional)</label><input className="inp" placeholder="Give a hint" value={fcForm.hint} onChange={e=>setFcForm(f=>({...f,hint:e.target.value}))}/></div><div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveFC} disabled={!fcForm.question||!fcForm.answer}>Create Flashcard</button></div></div></div>}
  {showModal==="qz"&&<div className="modal-bg" onClick={()=>setShowModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Create Quiz Question</h3><button onClick={()=>setShowModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div><div className="g2" style={{marginBottom:12}}><div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={qzForm.subject} onChange={e=>setQzForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div><label className="lbl">Topic</label><input className="inp" placeholder="Topic name" value={qzForm.topic} onChange={e=>setQzForm(f=>({...f,topic:e.target.value}))}/></div></div><div style={{marginBottom:12}}><label className="lbl">Question *</label><textarea className="inp" rows={2} placeholder="Enter the quiz question" value={qzForm.question} onChange={e=>setQzForm(f=>({...f,question:e.target.value}))} style={{resize:"none"}}/></div><div style={{marginBottom:12}}><label className="lbl">Options * (select correct answer)</label>{(qzForm.options||[]).map((opt,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><input type="radio" name="correct" checked={qzForm.correct===i} onChange={()=>setQzForm(f=>({...f,correct:i}))} style={{cursor:"pointer"}}/><input className="inp" placeholder={`Option ${String.fromCharCode(65+i)}`} value={opt} onChange={e=>{const o=[...(qzForm.options||[])];o[i]=e.target.value;setQzForm(f=>({...f,options:o}));}} style={{flex:1}}/></div>)}</div><div style={{marginBottom:18}}><label className="lbl">Explanation (optional)</label><input className="inp" placeholder="Explain why the answer is correct" value={qzForm.explanation} onChange={e=>setQzForm(f=>({...f,explanation:e.target.value}))}/></div><div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveQZ} disabled={!qzForm.question||(qzForm.options||[]).some(o=>!o)}>Create Question</button></div></div></div>}
  {showModal==="tk"&&<div className="modal-bg" onClick={()=>setShowModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Assign Task to Baibhav</h3><button onClick={()=>setShowModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div><div style={{marginBottom:12}}><label className="lbl">Task Title *</label><input className="inp" placeholder="e.g. Complete Maths exercises Ch-3" value={tkForm.title} onChange={e=>setTkForm(f=>({...f,title:e.target.value}))}/></div><div className="g2" style={{marginBottom:12}}><div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={tkForm.subject} onChange={e=>setTkForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div><label className="lbl">Due Date</label><input className="inp" type="date" value={tkForm.dueDate} onChange={e=>setTkForm(f=>({...f,dueDate:e.target.value}))}/></div></div><div style={{marginBottom:12}}><label className="lbl">Description</label><textarea className="inp" rows={2} placeholder="Describe what needs to be done..." value={tkForm.description} onChange={e=>setTkForm(f=>({...f,description:e.target.value}))} style={{resize:"none"}}/></div><div style={{marginBottom:18}}><label className="lbl">Priority</label><select className="inp" style={{appearance:"none"}} value={tkForm.priority} onChange={e=>setTkForm(f=>({...f,priority:e.target.value}))}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div><div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveTK} disabled={!tkForm.title}>Assign Task</button></div></div></div>}
  </div>);
}

function LearnPage({flashcards,quizzes,tasks,toggleTask,studyNotes}){
  const[tab,setTab]=useState("notes");
  const typeIcon={pdf:"📄",ppt:"📊",link:"🔗",video:"🎥",file:"📎"};
  return(<div className="fi"><div className="pt">🎯 Learn & Practice</div><div className="ps">Study notes, flashcards, quizzes and tasks from your teachers</div><div style={{display:"flex",gap:4,background:"#f1f5f9",padding:4,borderRadius:12,marginBottom:20}}>{[{id:"notes",l:`Study Notes (${studyNotes.length})`},{id:"flashcards",l:`Flashcards (${flashcards.length})`},{id:"quizzes",l:`Quizzes (${quizzes.length})`},{id:"tasks",l:`Tasks (${tasks.length})`}].map(t=><div key={t.id} className={`tab ${tab===t.id?"act":""}`} onClick={()=>setTab(t.id)}>{t.l}</div>)}</div>
  {tab==="notes"&&(studyNotes.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>📎</div><p>No study materials yet. Ask your teacher!</p></div>:<div>{studyNotes.map(n=><div key={n.id} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:12,border:"1px solid #e2e8f0",marginBottom:10,background:"#fff"}}><div style={{width:44,height:44,borderRadius:10,background:"#f1f5f9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{typeIcon[n.type]||"📎"}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,marginBottom:4}}>{n.title}</div><div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>{n.subject&&<span className="pill">{n.subject}</span>}{n.chapter&&<span className="pill">{n.chapter}</span>}{n.topic&&<span className="pill">{n.topic}</span>}</div>{n.description&&<div style={{fontSize:12,color:"#64748b"}}>{n.description}</div>}</div>{n.url&&<a href={n.url} target="_blank" style={{padding:"8px 16px",background:"#1F4E79",color:"white",borderRadius:8,fontSize:13,fontWeight:600,textDecoration:"none",flexShrink:0}}>Open</a>}</div>)}</div>)}
  {tab==="flashcards"&&(flashcards.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>🃏</div><p>No flashcards yet.</p></div>:<div className="g3">{flashcards.map(fc=><FlashCard key={fc.id} fc={fc}/>)}</div>)}
  {tab==="quizzes"&&(quizzes.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>❓</div><p>No quiz questions yet.</p></div>:<div style={{display:"flex",flexDirection:"column",gap:16}}>{quizzes.map((qz,i)=><QuizQuestion key={qz.id} qz={qz} num={i+1}/>)}</div>)}
  {tab==="tasks"&&(tasks.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>✅</div><p>No tasks assigned yet.</p></div>:<div style={{display:"flex",flexDirection:"column",gap:10}}>{tasks.map(t=><div key={t.id} className="task-item" style={{opacity:t.done?.8:1}}><div className="task-check" style={{background:t.done?"#276221":"white",borderColor:t.done?"#276221":"#e2e8f0",color:"white",cursor:"pointer"}} onClick={()=>toggleTask(t.id,t.done)}>{t.done?"✓":""}</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,textDecoration:t.done?"line-through":"none",color:t.done?"#64748b":"#0f172a"}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.subject}</div>}{t.description&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.description}</div>}<div style={{display:"flex",gap:8,marginTop:4}}>{t.dueDate&&<span style={{fontSize:11,color:"#C55A11",fontWeight:600}}>Due: {t.dueDate}</span>}<span className={`tag ${t.priority==="high"?"td2":t.priority==="medium"?"tw":"ts"}`}>{t.priority}</span>{t.done&&<span className="tag ts">Done on {t.doneDate}</span>}</div></div></div>)}</div>)}
  </div>);
}

function TasksPage({tasks,addTask,toggleTask,isT}){
  const[showModal,setShowModal]=useState(false);const[form,setForm]=useState({title:"",subject:"",description:"",dueDate:"",priority:"medium"});
  const save=async()=>{if(!form.title)return;await addTask(form);setForm({title:"",subject:"",description:"",dueDate:"",priority:"medium"});setShowModal(false);};
  const pending=tasks.filter(t=>!t.done);const done=tasks.filter(t=>t.done);
  return(<div className="fi"><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}><div className="pt">{isT?"Manage Tasks":"My Tasks"}</div>{isT&&<button className="btn bp" onClick={()=>setShowModal(true)}>+ Assign Task</button>}</div><div className="ps">{isT?"Assign tasks and track Baibhav completion":"Complete your assigned tasks"}</div><div className="g2" style={{marginBottom:20}}><div style={{background:"#FCE4D6",borderRadius:16,padding:"16px 20px"}}><div style={{fontSize:28,fontWeight:800,color:"#C55A11"}}>{pending.length}</div><div style={{fontSize:13,color:"#C55A11",fontWeight:600}}>Pending Tasks</div></div><div style={{background:"#C6EFCE",borderRadius:16,padding:"16px 20px"}}><div style={{fontSize:28,fontWeight:800,color:"#276221"}}>{done.length}</div><div style={{fontSize:13,color:"#276221",fontWeight:600}}>Completed Tasks</div></div></div>{pending.length>0&&<div style={{marginBottom:20}}><div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#C55A11"}}>Pending ({pending.length})</div>{pending.map(t=><div key={t.id} className="task-item"><div className="task-check" style={{cursor:"pointer"}} onClick={()=>toggleTask(t.id,t.done)}/><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.subject}</div>}{t.description&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.description}</div>}<div style={{display:"flex",gap:8,marginTop:4}}>{t.dueDate&&<span style={{fontSize:11,color:"#C55A11",fontWeight:600}}>Due: {t.dueDate}</span>}<span className={`tag ${t.priority==="high"?"td2":t.priority==="medium"?"tw":"ts"}`}>{t.priority}</span></div></div><span style={{fontSize:11,color:"#94a3b8"}}>by {t.createdBy}</span></div>)}</div>}{done.length>0&&<div><div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#276221"}}>Completed ({done.length})</div>{done.map(t=><div key={t.id} className="task-item" style={{opacity:.7}}><div className="task-check" style={{background:"#276221",borderColor:"#276221",color:"white",cursor:"pointer"}} onClick={()=>toggleTask(t.id,t.done)}>✓</div><div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,textDecoration:"line-through",color:"#64748b"}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{t.subject}</div>}<div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Done on {t.doneDate}</div></div></div>)}</div>}{tasks.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>✅</div><p>No tasks yet.{isT?" Assign some tasks to Baibhav!":""}</p></div>}{showModal&&<div className="modal-bg" onClick={()=>setShowModal(false)}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Assign Task to Baibhav</h3><button onClick={()=>setShowModal(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div><div style={{marginBottom:12}}><label className="lbl">Task Title *</label><input className="inp" placeholder="e.g. Complete Maths exercises Ch-3" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></div><div className="g2" style={{marginBottom:12}}><div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div><label className="lbl">Due Date</label><input className="inp" type="date" value={form.dueDate} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))}/></div></div><div style={{marginBottom:12}}><label className="lbl">Description</label><textarea className="inp" rows={2} placeholder="Describe what needs to be done..." value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} style={{resize:"none"}}/></div><div style={{marginBottom:18}}><label className="lbl">Priority</label><select className="inp" style={{appearance:"none"}} value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div><div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(false)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={save} disabled={!form.title}>Assign Task</button></div></div></div>}</div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
