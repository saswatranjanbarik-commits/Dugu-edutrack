  const subChs=fcForm.subject?(DS[fcForm.subject]?.chapters||[]):[];
  const chTps=fcForm.chapter?(subChs.find(c=>c.ch===fcForm.chapter)?.topics||[]):[];
  const tpSts=fcForm.topic?(chTps.find(t=>t.name===fcForm.topic)?.subtopics||[]):[];

  const saveFC=async()=>{if(!fcForm.question||!fcForm.answer)return;await addFlashcard(fcForm);setFcForm({subject:"",chapter:"",topic:"",subtopic:"",question:"",answer:"",hint:""});setShowModal(null);};
  const saveQZ=async()=>{if(!qzForm.question||(qzForm.options||[]).some(o=>!o))return;await addQuiz(qzForm);setQzForm({subject:"",chapter:"",topic:"",subtopic:"",question:"",options:["","","",""],correct:0,explanation:""});setShowModal(null);};
  const saveTK=async()=>{if(!tkForm.title)return;await addTask(tkForm);setTkForm({title:"",subject:"",description:"",dueDate:"",priority:"medium"});setShowModal(null);};

  // Bulk parse CSV/text
  const parseBulk=()=>{
    const lines=bulkText.trim().split("\n").filter(l=>l.trim());
    if(showBulk==="fc"){
      const parsed=lines.map(l=>{const parts=l.split("|");return{question:(parts[0]||"").trim(),answer:(parts[1]||"").trim(),hint:(parts[2]||"").trim()};}).filter(p=>p.question&&p.answer);
      setBulkParsed(parsed);
    } else {
      const parsed=[];let cur=null;
      lines.forEach(l=>{
        if(l.startsWith("Q:")){if(cur)parsed.push(cur);cur={question:l.slice(2).trim(),options:[],correct:0,explanation:""};}
        else if(l.startsWith("A:")&&cur){cur.options.push(l.slice(2).trim());}
        else if(l.startsWith("*A:")&&cur){cur.options.push(l.slice(3).trim());cur.correct=cur.options.length-1;}
        else if(l.startsWith("E:")&&cur){cur.explanation=l.slice(2).trim();}
      });
      if(cur)parsed.push(cur);
      setBulkParsed(parsed.filter(p=>p.question&&p.options.length>=2));
    }
  };

  const saveBulk=async()=>{
    for(const item of bulkParsed){
      if(showBulk==="fc")await addFlashcard({...bulkSub,...item});
      else await addQuiz({...bulkSub,...item});
    }
    setBulkText("");setBulkParsed([]);setShowBulk(null);
    showToast(`${bulkParsed.length} items added!`);
  };

  return(
    <div className="fi">
      <div className="pt">🎯 Flashcards, Quizzes & Tasks</div>
      <div className="ps">Create learning content and tasks for Baibhav</div>
      <div style={{display:"flex",gap:4,background:"#f1f5f9",padding:4,borderRadius:12,marginBottom:20}}>
        {[{id:"flashcards",l:`Flashcards (${flashcards.length})`},{id:"quizzes",l:`Quizzes (${quizzes.length})`},{id:"tasks",l:`Tasks (${tasks.length})`}].map(t=>(
          <div key={t.id} className={`tab ${tab===t.id?"act":""}`} onClick={()=>setTab(t.id)}>{t.l}</div>
        ))}
      </div>

      {tab==="flashcards"&&(
        <div>
          {isT&&<div style={{display:"flex",gap:8,marginBottom:16}}>
            <button className="btn bp" onClick={()=>setShowModal("fc")}>+ Create Flashcard</button>
            <button className="btn bpu" onClick={()=>{setShowBulk("fc");setBulkParsed([]);}}>📤 Bulk Upload</button>
          </div>}
          {flashcards.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>🃏</div><p>No flashcards yet.{isT?" Create some for Baibhav!":""}</p></div>:(
            <div className="g3">{flashcards.map(fc=><FlashCard key={fc.id} fc={fc}/>)}</div>
          )}
        </div>
      )}

      {tab==="quizzes"&&(
        <div>
          {isT&&<div style={{display:"flex",gap:8,marginBottom:16}}>
            <button className="btn bp" onClick={()=>setShowModal("qz")}>+ Create Quiz Question</button>
            <button className="btn bpu" onClick={()=>{setShowBulk("qz");setBulkParsed([]);}}>📤 Bulk Upload</button>
          </div>}
          {quizzes.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>❓</div><p>No quiz questions yet.{isT?" Add some!":""}</p></div>:(
            <div style={{display:"flex",flexDirection:"column",gap:16}}>{quizzes.map((qz,i)=><QuizQuestion key={qz.id} qz={qz} num={i+1}/>)}</div>
          )}
        </div>
      )}

      {tab==="tasks"&&(
        <div>
          {isT&&<button className="btn bp" style={{marginBottom:16}} onClick={()=>setShowModal("tk")}>+ Assign Task</button>}
          {tasks.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>✅</div><p>No tasks assigned yet.</p></div>:(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {tasks.map(t=>(
                <div key={t.id} className="task-item" style={{opacity:t.done?.8:1}}>
                  <div className="task-check" style={{background:t.done?"#276221":"white",borderColor:t.done?"#276221":"#e2e8f0",color:"white"}}>{t.done?"✓":""}</div>
                  <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,textDecoration:t.done?"line-through":"none",color:t.done?"#64748b":"#0f172a"}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.subject}</div>}{t.description&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.description}</div>}<div style={{display:"flex",gap:8,marginTop:4}}>{t.dueDate&&<span style={{fontSize:11,color:"#C55A11",fontWeight:600}}>Due: {t.dueDate}</span>}<span className={`tag ${t.priority==="high"?"td2":t.priority==="medium"?"tw":"ts"}`}>{t.priority}</span>{t.done&&<span className="tag ts">Done</span>}</div></div>
                  <span style={{fontSize:11,color:"#94a3b8"}}>by {t.createdBy}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {/* Bulk Upload Modal */}
      {showBulk&&(
        <div className="modal-bg" onClick={()=>setShowBulk(null)}>
          <div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><h3 style={{fontSize:18,fontWeight:700}}>Bulk Upload {showBulk==="fc"?"Flashcards":"Quiz Questions"}</h3><button onClick={()=>setShowBulk(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div style={{background:"#f8fafc",borderRadius:10,padding:14,marginBottom:16,fontSize:13}}>
              <div style={{fontWeight:700,marginBottom:6,color:"#1F4E79"}}>{showBulk==="fc"?"Format: Question | Answer | Hint (one per line)":"Format: Q: Question, A: Option, *A: Correct Option, E: Explanation"}</div>
              {showBulk==="fc"?<pre style={{fontSize:11,color:"#64748b",lineHeight:1.6}}>{"What is a Noun? | A naming word | Think of names\nWhat is an Article? | A, An, The | Used before nouns\nWhat is a Verb? | An action word | Running, jumping"}</pre>:<pre style={{fontSize:11,color:"#64748b",lineHeight:1.6}}>{"Q: What is the capital of India?\nA: Mumbai\n*A: New Delhi\nA: Kolkata\nA: Chennai\nE: New Delhi is the capital of India"}</pre>}
            </div>
            <div style={{marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8}}>Assign to Subject/Topic (optional):</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
                <select className="inp" style={{appearance:"none",fontSize:12}} value={bulkSub.subject} onChange={e=>setBulkSub(f=>({...f,subject:e.target.value,chapter:"",topic:"",subtopic:""}))}><option value="">Subject</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select>
                <select className="inp" style={{appearance:"none",fontSize:12}} value={bulkSub.chapter} onChange={e=>setBulkSub(f=>({...f,chapter:e.target.value,topic:"",subtopic:""}))} disabled={!bulkSub.subject}><option value="">Chapter</option>{(bulkSub.subject?DS[bulkSub.subject]?.chapters||[]:[]).map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select>
                <select className="inp" style={{appearance:"none",fontSize:12}} value={bulkSub.topic} onChange={e=>setBulkSub(f=>({...f,topic:e.target.value,subtopic:""}))} disabled={!bulkSub.chapter}><option value="">Topic</option>{(bulkSub.chapter?(DS[bulkSub.subject]?.chapters||[]).find(c=>c.ch===bulkSub.chapter)?.topics||[]:[]).map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select>
                <select className="inp" style={{appearance:"none",fontSize:12}} value={bulkSub.subtopic} onChange={e=>setBulkSub(f=>({...f,subtopic:e.target.value}))} disabled={!bulkSub.topic}><option value="">Sub-topic</option>{(bulkSub.topic?(DS[bulkSub.subject]?.chapters||[]).find(c=>c.ch===bulkSub.chapter)?.topics?.find(t=>t.name===bulkSub.topic)?.subtopics||[]:[]).map(s=><option key={s} value={s}>{s}</option>)}</select>
              </div>
            </div>
            <div style={{marginBottom:12}}><label className="lbl">Paste your content here:</label><textarea className="inp" rows={8} placeholder={showBulk==="fc"?"Question | Answer | Hint\n...":"Q: Question\nA: Option\n*A: Correct Option\n..."} value={bulkText} onChange={e=>setBulkText(e.target.value)} style={{resize:"vertical",fontFamily:"monospace",fontSize:13}}/></div>
            <button className="btn bg2 bsm" style={{marginBottom:12}} onClick={parseBulk} disabled={!bulkText.trim()}>Preview ({bulkParsed.length} items parsed)</button>
            {bulkParsed.length>0&&(
              <div style={{maxHeight:200,overflowY:"auto",border:"1px solid #e2e8f0",borderRadius:10,padding:10,marginBottom:12}}>
                {bulkParsed.map((item,i)=>(
                  <div key={i} style={{padding:"6px 10px",borderRadius:8,background:"#f8fafc",marginBottom:6,fontSize:12}}>
                    <div style={{fontWeight:600}}>{i+1}. {item.question}</div>
                    <div style={{color:"#276221",marginTop:2}}>{showBulk==="fc"?"Answer: "+item.answer:"Options: "+item.options?.join(" | ")}</div>
                  </div>
                ))}
              </div>
            )}
            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowBulk(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveBulk} disabled={bulkParsed.length===0}>Save {bulkParsed.length} Items</button></div>
          </div>
        </div>
      )}

      {/* Single Flashcard Modal */}
      {showModal==="fc"&&(
        <div className="modal-bg" onClick={()=>setShowModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Create Flashcard</h3><button onClick={()=>setShowModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div className="g2" style={{marginBottom:12}}>
              <div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={fcForm.subject} onChange={e=>setFcForm(f=>({...f,subject:e.target.value,chapter:"",topic:"",subtopic:""}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
              <div><label className="lbl">Chapter</label><select className="inp" style={{appearance:"none"}} value={fcForm.chapter} onChange={e=>setFcForm(f=>({...f,chapter:e.target.value,topic:"",subtopic:""}))} disabled={!fcForm.subject}><option value="">-- Select --</option>{subChs.map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select></div>
            </div>
            <div className="g2" style={{marginBottom:12}}>
              <div><label className="lbl">Topic</label><select className="inp" style={{appearance:"none"}} value={fcForm.topic} onChange={e=>setFcForm(f=>({...f,topic:e.target.value,subtopic:""}))} disabled={!fcForm.chapter}><option value="">-- Select --</option>{chTps.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></div>
              <div><label className="lbl">Sub-topic</label><select className="inp" style={{appearance:"none"}} value={fcForm.subtopic} onChange={e=>setFcForm(f=>({...f,subtopic:e.target.value}))} disabled={!fcForm.topic}><option value="">-- Select --</option>{tpSts.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            </div>
            <div style={{marginBottom:12}}><label className="lbl">Question / Front *</label><textarea className="inp" rows={2} placeholder="What is the question or term?" value={fcForm.question} onChange={e=>setFcForm(f=>({...f,question:e.target.value}))} style={{resize:"none"}}/></div>
            <div style={{marginBottom:12}}><label className="lbl">Answer / Back *</label><textarea className="inp" rows={2} placeholder="What is the answer or definition?" value={fcForm.answer} onChange={e=>setFcForm(f=>({...f,answer:e.target.value}))} style={{resize:"none"}}/></div>
            <div style={{marginBottom:18}}><label className="lbl">Hint (optional)</label><input className="inp" placeholder="Give a hint to help remember" value={fcForm.hint} onChange={e=>setFcForm(f=>({...f,hint:e.target.value}))}/></div>
            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveFC} disabled={!fcForm.question||!fcForm.answer}>Create Flashcard</button></div>
          </div>
        </div>
      )}

      {/* Quiz Modal */}
      {showModal==="qz"&&(
        <div className="modal-bg" onClick={()=>setShowModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Create Quiz Question</h3><button onClick={()=>setShowModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div className="g2" style={{marginBottom:12}}>
              <div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={qzForm.subject} onChange={e=>setQzForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
              <div><label className="lbl">Topic</label><input className="inp" placeholder="Topic name" value={qzForm.topic} onChange={e=>setQzForm(f=>({...f,topic:e.target.value}))}/></div>
            </div>
            <div style={{marginBottom:12}}><label className="lbl">Question *</label><textarea className="inp" rows={2} placeholder="Enter the quiz question" value={qzForm.question} onChange={e=>setQzForm(f=>({...f,question:e.target.value}))} style={{resize:"none"}}/></div>
            <div style={{marginBottom:12}}>
              <label className="lbl">Options * (select correct answer)</label>
              {(qzForm.options||[]).map((opt,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <input type="radio" name="correct" checked={qzForm.correct===i} onChange={()=>setQzForm(f=>({...f,correct:i}))} style={{cursor:"pointer"}}/>
                  <input className="inp" placeholder={`Option ${String.fromCharCode(65+i)}`} value={opt} onChange={e=>{const o=[...(qzForm.options||[])];o[i]=e.target.value;setQzForm(f=>({...f,options:o}));}} style={{flex:1}}/>
                </div>
              ))}
            </div>
            <div style={{marginBottom:18}}><label className="lbl">Explanation (optional)</label><input className="inp" placeholder="Explain why the answer is correct" value={qzForm.explanation} onChange={e=>setQzForm(f=>({...f,explanation:e.target.value}))}/></div>
            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveQZ} disabled={!qzForm.question||(qzForm.options||[]).some(o=>!o)}>Create Question</button></div>
          </div>
        </div>
      )}

      {/* Task Modal */}
      {showModal==="tk"&&(
        <div className="modal-bg" onClick={()=>setShowModal(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Assign Task to Baibhav</h3><button onClick={()=>setShowModal(null)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div style={{marginBottom:12}}><label className="lbl">Task Title *</label><input className="inp" placeholder="e.g. Complete Maths exercises Ch-3" value={tkForm.title} onChange={e=>setTkForm(f=>({...f,title:e.target.value}))}/></div>
            <div className="g2" style={{marginBottom:12}}><div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={tkForm.subject} onChange={e=>setTkForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div><label className="lbl">Due Date</label><input className="inp" type="date" value={tkForm.dueDate} onChange={e=>setTkForm(f=>({...f,dueDate:e.target.value}))}/></div></div>
            <div style={{marginBottom:12}}><label className="lbl">Description</label><textarea className="inp" rows={2} placeholder="Describe what needs to be done..." value={tkForm.description} onChange={e=>setTkForm(f=>({...f,description:e.target.value}))} style={{resize:"none"}}/></div>
            <div style={{marginBottom:18}}><label className="lbl">Priority</label><select className="inp" style={{appearance:"none"}} value={tkForm.priority} onChange={e=>setTkForm(f=>({...f,priority:e.target.value}))}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(null)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveTK} disabled={!tkForm.title}>Assign Task</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function FlashCard({fc}){
  const[flipped,setFlipped]=useState(false);
  return(
    <div onClick={()=>setFlipped(f=>!f)} style={{cursor:"pointer",perspective:"600px"}}>
      <div style={{transition:"transform .5s",transformStyle:"preserve-3d",position:"relative",height:180,transform:flipped?"rotateY(180deg)":"none"}}>
        <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",padding:20,textAlign:"center",background:"linear-gradient(135deg,#1F4E79,#2E75B6)",color:"#fff"}}>
          <div>{fc.subject&&<div style={{fontSize:10,opacity:.8,marginBottom:6,fontWeight:600}}>{fc.subject}{fc.topic?" · "+fc.topic:""}</div>}<div style={{fontSize:14,fontWeight:700,lineHeight:1.4}}>{fc.question}</div>{fc.hint&&<div style={{fontSize:10,opacity:.7,marginTop:8}}>Hint: {fc.hint}</div>}<div style={{fontSize:10,opacity:.6,marginTop:10}}>Tap to reveal</div></div>
        </div>
        <div style={{position:"absolute",inset:0,backfaceVisibility:"hidden",borderRadius:14,display:"flex",alignItems:"center",justifyContent:"center",padding:20,textAlign:"center",background:"linear-gradient(135deg,#276221,#4CAF50)",color:"#fff",transform:"rotateY(180deg)"}}>
          <div><div style={{fontSize:10,opacity:.8,marginBottom:6,fontWeight:600}}>ANSWER</div><div style={{fontSize:14,fontWeight:700,lineHeight:1.4}}>{fc.answer}</div><div style={{fontSize:10,opacity:.6,marginTop:10}}>Tap to flip back</div></div>
        </div>
      </div>
    </div>
  );
}

function QuizQuestion({qz,num}){
  const[selected,setSelected]=useState(null);
  const[revealed,setReveal]=useState(false);
  return(
    <div className="card">
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
        <div style={{width:28,height:28,borderRadius:"50%",background:"#1F4E79",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13,flexShrink:0}}>Q{num}</div>
        {qz.subject&&<span className="tag tp">{qz.subject}</span>}
        {qz.topic&&<span className="tag" style={{background:"#f1f5f9",color:"#334155"}}>{qz.topic}</span>}
      </div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:14,lineHeight:1.5}}>{qz.question}</div>
      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
        {(qz.options||[]).map((opt,i)=>(
          <button key={i} onClick={()=>{if(!revealed)setSelected(i);}}
            style={{padding:"12px 16px",borderRadius:10,border:`2px solid ${revealed?(i===qz.correct?"#276221":i===selected?"#9C0006":"#e2e8f0"):(selected===i?"#1F4E79":"#e2e8f0")}`,background:revealed?(i===qz.correct?"#C6EFCE":i===selected&&i!==qz.correct?"#FFC7CE":"white"):(selected===i?"#DCE6F1":"white"),color:revealed?(i===qz.correct?"#276221":i===selected&&i!==qz.correct?"#9C0006":"#334155"):(selected===i?"#1F4E79":"#334155"),fontSize:14,fontWeight:selected===i?600:400,cursor:"pointer",textAlign:"left",width:"100%",fontFamily:"inherit"}}>
            <span style={{fontWeight:700,marginRight:8}}>{String.fromCharCode(65+i)}.</span>{opt}
          </button>
        ))}
      </div>
      {!revealed?<button className="btn bp bsm" onClick={()=>{if(selected!==null)setReveal(true);}} disabled={selected===null}>Check Answer</button>:(
        <div><div style={{padding:"10px 14px",borderRadius:10,background:selected===qz.correct?"#C6EFCE":"#FFC7CE",marginBottom:10}}><div style={{fontWeight:700,color:selected===qz.correct?"#276221":"#9C0006",fontSize:14}}>{selected===qz.correct?"Correct!":"Incorrect"}</div>{qz.explanation&&<div style={{fontSize:13,marginTop:4,color:"#334155"}}>{qz.explanation}</div>}</div><button className="btn bg2 bsm" onClick={()=>{setSelected(null);setReveal(false);}}>Try Again</button></div>
      )}
    </div>
  );
}

function LearnPage({flashcards,quizzes,tasks,toggleTask,studyNotes}){
  const[tab,setTab]=useState("notes");
  const typeIcon={pdf:"📄",ppt:"📊",link:"🔗",video:"🎥",file:"📎"};
  const typeColor={pdf:"#9C0006",ppt:"#C55A11",link:"#1F4E79",video:"#276221",file:"#4B2E83"};
  return(
    <div className="fi">
      <div className="pt">🎯 Learn & Practice</div>
      <div className="ps">Study notes, flashcards, quizzes and tasks from your teachers</div>
      <div style={{display:"flex",gap:4,background:"#f1f5f9",padding:4,borderRadius:12,marginBottom:20}}>
        {[{id:"notes",l:`Study Notes (${studyNotes.length})`},{id:"flashcards",l:`Flashcards (${flashcards.length})`},{id:"quizzes",l:`Quizzes (${quizzes.length})`},{id:"tasks",l:`Tasks (${tasks.length})`}].map(t=><div key={t.id} className={`tab ${tab===t.id?"act":""}`} onClick={()=>setTab(t.id)}>{t.l}</div>)}
      </div>
      {tab==="notes"&&(studyNotes.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>📎</div><p>No study materials yet. Ask your teacher to add some!</p></div>:(
        <div>{studyNotes.map(n=>(
          <div key={n.id} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",borderRadius:12,border:"1px solid #e2e8f0",marginBottom:10,background:"#fff"}}>
            <div style={{width:44,height:44,borderRadius:10,background:`${typeColor[n.type]||"#1F4E79"}15`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>{typeIcon[n.type]||"📎"}</div>
            <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,marginBottom:4}}>{n.title}</div><div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:4}}>{n.subject&&<span className="pill">{n.subject}</span>}{n.chapter&&<span className="pill">{n.chapter}</span>}{n.topic&&<span className="pill">{n.topic}</span>}{n.subtopic&&<span className="pill">{n.subtopic}</span>}</div>{n.description&&<div style={{fontSize:12,color:"#64748b"}}>{n.description}</div>}</div>
            {n.url&&<a href={n.url} target="_blank" style={{padding:"8px 16px",background:SC[n.subject]||"#1F4E79",color:"white",borderRadius:8,fontSize:13,fontWeight:600,textDecoration:"none",flexShrink:0}}>Open</a>}
          </div>
        ))}</div>
      ))}
      {tab==="flashcards"&&(flashcards.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>🃏</div><p>No flashcards yet.</p></div>:<div className="g3">{flashcards.map(fc=><FlashCard key={fc.id} fc={fc}/>)}</div>)}
      {tab==="quizzes"&&(quizzes.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>❓</div><p>No quiz questions yet.</p></div>:<div style={{display:"flex",flexDirection:"column",gap:16}}>{quizzes.map((qz,i)=><QuizQuestion key={qz.id} qz={qz} num={i+1}/>)}</div>)}
      {tab==="tasks"&&(tasks.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>✅</div><p>No tasks assigned yet.</p></div>:(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {tasks.map(t=>(
            <div key={t.id} className="task-item" style={{opacity:t.done?.8:1}}>
              <div className={`task-check ${t.done?"done":""}`} style={{background:t.done?"#276221":"white",borderColor:t.done?"#276221":"#e2e8f0",color:"white",cursor:"pointer"}} onClick={()=>toggleTask(t.id,t.done)}>{t.done?"✓":""}</div>
              <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,textDecoration:t.done?"line-through":"none",color:t.done?"#64748b":"#0f172a"}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.subject}</div>}{t.description&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.description}</div>}<div style={{display:"flex",gap:8,marginTop:4}}>{t.dueDate&&<span style={{fontSize:11,color:"#C55A11",fontWeight:600}}>Due: {t.dueDate}</span>}<span className={`tag ${t.priority==="high"?"td2":t.priority==="medium"?"tw":"ts"}`}>{t.priority}</span>{t.done&&<span className="tag ts">Done on {t.doneDate}</span>}</div></div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function TasksPage({tasks,addTask,toggleTask,isT}){
  const[showModal,setShowModal]=useState(false);
  const[form,setForm]=useState({title:"",subject:"",description:"",dueDate:"",priority:"medium"});
  const save=async()=>{if(!form.title)return;await addTask(form);setForm({title:"",subject:"",description:"",dueDate:"",priority:"medium"});setShowModal(false);};
  const pending=tasks.filter(t=>!t.done);const done=tasks.filter(t=>t.done);
  return(
    <div className="fi">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div className="pt">{isT?"Manage Tasks":"My Tasks"}</div>
        {isT&&<button className="btn bp" onClick={()=>setShowModal(true)}>+ Assign Task</button>}
      </div>
      <div className="ps">{isT?"Assign tasks and track Baibhav completion":"Complete your assigned tasks"}</div>
      <div className="g2" style={{marginBottom:20}}>
        <div style={{background:"#FCE4D6",borderRadius:16,padding:"16px 20px"}}><div style={{fontSize:28,fontWeight:800,color:"#C55A11"}}>{pending.length}</div><div style={{fontSize:13,color:"#C55A11",fontWeight:600}}>Pending Tasks</div></div>
        <div style={{background:"#C6EFCE",borderRadius:16,padding:"16px 20px"}}><div style={{fontSize:28,fontWeight:800,color:"#276221"}}>{done.length}</div><div style={{fontSize:13,color:"#276221",fontWeight:600}}>Completed Tasks</div></div>
      </div>
      {pending.length>0&&<div style={{marginBottom:20}}><div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#C55A11"}}>Pending ({pending.length})</div>{pending.map(t=>(
        <div key={t.id} className="task-item">
          <div className="task-check" style={{cursor:"pointer"}} onClick={()=>toggleTask(t.id,t.done)}/>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.subject}</div>}{t.description&&<div style={{fontSize:12,color:"#64748b",marginTop:2}}>{t.description}</div>}<div style={{display:"flex",gap:8,marginTop:4}}>{t.dueDate&&<span style={{fontSize:11,color:"#C55A11",fontWeight:600}}>Due: {t.dueDate}</span>}<span className={`tag ${t.priority==="high"?"td2":t.priority==="medium"?"tw":"ts"}`}>{t.priority}</span></div></div>
          <span style={{fontSize:11,color:"#94a3b8"}}>by {t.createdBy}</span>
        </div>
      ))}</div>}
      {done.length>0&&<div><div style={{fontSize:14,fontWeight:700,marginBottom:10,color:"#276221"}}>Completed ({done.length})</div>{done.map(t=>(
        <div key={t.id} className="task-item" style={{opacity:.7}}>
          <div className="task-check" style={{background:"#276221",borderColor:"#276221",color:"white",cursor:"pointer"}} onClick={()=>toggleTask(t.id,t.done)}>✓</div>
          <div style={{flex:1}}><div style={{fontSize:14,fontWeight:600,textDecoration:"line-through",color:"#64748b"}}>{t.title}</div>{t.subject&&<div style={{fontSize:12,color:"#94a3b8",marginTop:2}}>{t.subject}</div>}<div style={{fontSize:11,color:"#94a3b8",marginTop:4}}>Done on {t.doneDate}</div></div>
        </div>
      ))}</div>}
      {tasks.length===0&&<div style={{textAlign:"center",padding:"40px 0",color:"#64748b"}}><div style={{fontSize:40,marginBottom:8}}>✅</div><p>No tasks yet.{isT?" Assign some tasks to Baibhav!":""}</p></div>}
      {showModal&&(
        <div className="modal-bg" onClick={()=>setShowModal(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h3 style={{fontSize:18,fontWeight:700}}>Assign Task to Baibhav</h3><button onClick={()=>setShowModal(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div style={{marginBottom:12}}><label className="lbl">Task Title *</label><input className="inp" placeholder="e.g. Complete Maths exercises Ch-3" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></div>
            <div className="g2" style={{marginBottom:12}}><div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div><div><label className="lbl">Due Date</label><input className="inp" type="date" value={form.dueDate} onChange={e=>setForm(f=>({...f,dueDate:e.target.value}))}/></div></div>
            <div style={{marginBottom:12}}><label className="lbl">Description</label><textarea className="inp" rows={2} placeholder="Describe what needs to be done..." value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} style={{resize:"none"}}/></div>
            <div style={{marginBottom:18}}><label className="lbl">Priority</label><select className="inp" style={{appearance:"none"}} value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))}><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowModal(false)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={save} disabled={!form.title}>Assign Task</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

function RevisionPage({revisions,markRevised}){
  const[tab,setTab]=useState("today");
  const today=new Date().toISOString().split("T")[0];
  const tr=revisions.filter(r=>!r.done&&r.dueDate<=today);
  const or=revisions.filter(r=>!r.done&&r.dueDate<today);
  const ur=revisions.filter(r=>{const n=new Date();n.setDate(n.getDate()+7);return!r.done&&r.dueDate>today&&r.dueDate<=n.toISOString().split("T")[0];});
  const dr=revisions.filter(r=>r.done);
  const cl=tab==="today"?tr:tab==="overdue"?or:tab==="upcoming"?ur:dr;
  const sc={English:"#1F4E79",Hindi:"#4B2E83",Odia:"#7F6000",Mathematics:"#1F6B5B",Science:"#375623","Social Studies":"#C55A11","Computer Science":"#1F3864","Moral Science":"#4A1942","General Knowledge":"#404040"};
  return(
    <div className="fi">
      <div className="pt">Revision Planner</div>
      <div className="ps">7-day revision cycle — auto-scheduled after each topic is taught</div>
      <div className="g4" style={{marginBottom:20}}>
        {[{l:"Overdue",v:or.length,c:"#9C0006",bg:"#FFC7CE"},{l:"Due Today",v:tr.length,c:"#C55A11",bg:"#FCE4D6"},{l:"This Week",v:ur.length,c:"#1F4E79",bg:"#DCE6F1"},{l:"Completed",v:dr.length,c:"#276221",bg:"#C6EFCE"}].map(s=><div key={s.l} style={{background:s.bg,borderRadius:16,padding:"14px 18px"}}><div style={{fontSize:26,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:12,color:s.c,fontWeight:600}}>{s.l}</div></div>)}
      </div>
      {or.length>0&&<div style={{background:"#FFC7CE",border:"2px solid #9C0006",borderRadius:12,padding:"10px 14px",marginBottom:16,display:"flex",alignItems:"center",gap:10}}><span>⚠️</span><div style={{fontWeight:700,color:"#9C0006",fontSize:13}}>{or.length} overdue revision{or.length>1?"s":""}! Please revise these topics.</div></div>}
      <div style={{display:"flex",gap:4,background:"#f1f5f9",padding:4,borderRadius:12,marginBottom:16}}>
        {[{id:"today",l:`Today (${tr.length})`},{id:"overdue",l:`Overdue (${or.length})`},{id:"upcoming",l:`Upcoming (${ur.length})`},{id:"done",l:`Done (${dr.length})`}].map(t=><div key={t.id} className={`tab ${tab===t.id?"act":""}`} onClick={()=>setTab(t.id)}>{t.l}</div>)}
      </div>
      <div className="card">
        {cl.length===0?<div style={{textAlign:"center",padding:"32px 0",color:"#64748b",fontSize:13}}>{tab==="today"?"No revisions due today — great job!":"No items here"}</div>:(
          <div style={{maxHeight:500,overflowY:"auto"}}>
            {cl.map(r=>(
              <div key={r.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",borderRadius:12,borderLeft:`4px solid ${sc[r.subject]||"#1F4E79"}`,marginBottom:8,background:"white",boxShadow:"0 2px 8px rgba(0,0,0,.06)"}}>
                <div style={{flex:1}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}><span style={{fontSize:13,fontWeight:700,color:sc[r.subject]||"#1F4E79"}}>{r.subject}</span><span style={{fontSize:12,color:"#64748b"}}>{r.chapter}</span></div>
                  <div style={{fontSize:13,color:"#334155",marginBottom:3}}>{r.topic}{r.subtopic?" → "+r.subtopic:""}</div>
                  <div style={{fontSize:11,color:"#94a3b8"}}>Taught: {r.taughtDate} · Due: {r.dueDate}{r.doneDate?` · Done: ${r.doneDate}`:""}</div>
                </div>
                {tab!=="done"&&!r.done&&<button className="btn bs bsm" onClick={()=>markRevised(r.id)}>Done</button>}
                {r.done&&<span className="tag ts">Revised</span>}
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function NotesPage({notes,addNote,profile}){
  const[text,setText]=useState("");const[saving,setSaving]=useState(false);
  const qn=["Covered today topics as per timetable","Baibhav needs extra help with Maths fractions","Revision done for English Ch-1 and Ch-2","Maths test announced for next week","Baibhav did great in SST Olympiad today!","Please revise Science Ch-1 tomorrow","Focus needed on Hindi grammar this week","Homework given — complete by tomorrow","Tutor session scheduled for tomorrow","Study notes uploaded for Chapter 3"];
  const add=async()=>{if(!text.trim())return;setSaving(true);await addNote(text.trim());setText("");setSaving(false);};
  return(
    <div className="fi">
      <div className="pt">Team Coordination Notes</div>
      <div className="ps">Saswat and Swagat — real-time shared notes from any location</div>
      <div className="g2">
        <div>
          <div className="card" style={{marginBottom:16}}>
            <div className="st">Add a Note</div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"10px 14px",background:"#f8fafc",borderRadius:10}}>
              <div style={{width:32,height:32,borderRadius:"50%",background:"#1F4E79",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>{profile?.avatar||"T"}</div>
              <div><div style={{fontSize:13,fontWeight:700}}>{profile?.name||"Teacher"}</div><div style={{fontSize:11,color:"#64748b"}}>{profile?.role} · Online</div></div>
              <span style={{width:7,height:7,borderRadius:"50%",background:"#22c55e",display:"inline-block",marginLeft:"auto"}}/>
            </div>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Write a coordination note — visible to all teachers instantly..." style={{width:"100%",minHeight:100,padding:"10px 14px",border:"2px solid #e2e8f0",borderRadius:10,fontSize:14,fontFamily:"inherit",resize:"vertical",outline:"none"}}/>
            <button className="btn bp bfw" style={{marginTop:10}} onClick={add} disabled={!text.trim()||saving}>{saving?"Saving...":"Post Note (syncs instantly)"}</button>
          </div>
          <div className="card"><div className="st">Quick Notes</div>{qn.map((n,i)=><button key={i} onClick={()=>setText(n)} style={{display:"block",width:"100%",padding:"8px 12px",borderRadius:8,border:"1px solid #e2e8f0",background:"#f8fafc",fontSize:12,cursor:"pointer",textAlign:"left",marginBottom:6,color:"#334155"}}>{n}</button>)}</div>
        </div>
        <div className="card">
          <div className="st">Live Notes Feed</div>
          {notes.length===0?<div style={{textAlign:"center",padding:"40px 0",color:"#64748b",fontSize:13}}><div style={{fontSize:36,marginBottom:8}}>💬</div>No notes yet. Be the first to post!</div>:(
            <div style={{maxHeight:520,overflowY:"auto"}}>
              {notes.map(n=>(
                <div key={n.id} style={{padding:"12px 14px",borderRadius:10,background:"#f8fafc",border:"1px solid #e2e8f0",marginBottom:10,borderLeft:"3px solid #1F4E79"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                    <div style={{width:28,height:28,borderRadius:"50%",background:"#1F4E79",color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:12}}>{n.author?.[0]||"T"}</div>
                    <span style={{fontSize:13,fontWeight:700}}>{n.author}</span>
                    <span style={{fontSize:11,color:"#64748b",marginLeft:"auto"}}>{n.createdAt?.toDate?new Date(n.createdAt.toDate()).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"Just now"}</span>
                  </div>
                  <p style={{fontSize:13,color:"#334155",lineHeight:1.6}}>{n.text}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TimetablePage(){
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const tn=days[new Date().getDay()];
  const TT={Monday:["English","Odia","Maths","SST","BREAK","Science","GK","Games","Yoga"],Tuesday:["English","Hindi","Maths","Science","BREAK","SST","Odia","Art","CSPD"],Wednesday:["English","Maths","Science","Hindi","BREAK","Odia","SST","Music","GK"],Thursday:["English","Science","SST","Maths","BREAK","Hindi","Maths Lab","Comp Lab","Dance"],Friday:["English","GK","Hindi","Odia","BREAK","Maths","Science","SST","Library"],Saturday:["English","SST","Odia","Science","BREAK","Maths","Hindi","Comp","Art"]};
  const DL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const PR=["P1 10:30","P2 11:10","P3 11:50","P4 12:30","BREAK","P5 1:30","P6 2:10","P7 2:50","P8 3:30"];
  const SCC={English:"#DCE6F1",Hindi:"#E8E0F0",Odia:"#FFF2CC",Maths:"#DAEEE6",Science:"#E2EFDA",SST:"#FCE4D6",GK:"#F2F2F2",Games:"#E2EFDA",Yoga:"#E2EFDA",Art:"#FCE4D6",CSPD:"#EAD1DC",Music:"#EAD1DC",Dance:"#EAD1DC","Maths Lab":"#DAEEE6","Comp Lab":"#D9E1F2",Comp:"#D9E1F2",Library:"#F2F2F2",BREAK:"#FFE699"};
  return(
    <div className="fi">
      <div className="pt">School Timetable</div>
      <div className="ps">Buxi Jagabandhu English Medium School-II · Std 5A · Mrs. Tarulata Mohanty</div>
      <div style={{background:"white",borderRadius:16,boxShadow:"0 4px 16px rgba(0,0,0,.12)",overflow:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:700}}>
          <thead><tr><th style={{padding:"12px 16px",background:"#1F4E79",color:"white",fontSize:13,fontWeight:700,textAlign:"left",minWidth:90}}>Day</th>{PR.map((p,i)=><th key={i} style={{padding:"10px 8px",background:"#1F4E79",color:"white",fontSize:11,fontWeight:600,textAlign:"center",minWidth:80}}>{p}</th>)}</tr></thead>
          <tbody>{DL.map(day=><tr key={day} style={{background:day===tn?"#FFFDE7":"white"}}><td style={{padding:"10px 16px",fontWeight:700,fontSize:13,borderRight:"2px solid #e2e8f0",borderBottom:"1px solid #e2e8f0"}}>{day===tn&&<span style={{fontSize:10,background:"#C55A11",color:"white",padding:"1px 6px",borderRadius:9999,marginRight:6,fontWeight:700}}>TODAY</span>}{day}</td>{TT[day].map((subj,i)=><td key={i} style={{padding:"8px 6px",textAlign:"center",borderBottom:"1px solid #e2e8f0",borderRight:"1px solid #e2e8f0"}}><span style={{display:"inline-block",padding:"4px 8px",borderRadius:8,background:SCC[subj]||"#F2F2F2",fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{subj}</span></td>)}</tr>)}</tbody>
        </table>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
