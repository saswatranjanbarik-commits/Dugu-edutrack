function studentLog(periodIdx) {
  var subjects = window._ttSubjects || [];
  var subj = subjects[periodIdx] || '';
  if (!subj || subj === 'BREAK') return;
  var inputEl = el('ttinp' + periodIdx);
  var topicText = inputEl ? inputEl.value.trim() : '';
  if (!topicText) { toast('Please type what was taught in ' + subj); return; }
  var chs = (S.syllabus[subj] && S.syllabus[subj].chapters) || SYL[subj] || [];
  var ch = chs.length > 0 ? chs[0].ch : '';
  var rd = new Date(today()); rd.setDate(rd.getDate() + 7);
  var rDue = rd.toISOString().split('T')[0];
  db.collection('topics').add({
    subject: subj, chapter: ch, topic: topicText, subtopic: '', date: today(),
    status: 'selfstudy', notes: 'Logged by Baibhav',
    revisionDue: rDue, loggedBy: S.profile ? S.profile.name : 'Baibhav',
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function() {
    db.collection('revisions').add({
      subject: subj, chapter: ch, topic: topicText, subtopic: '',
      taughtDate: today(), dueDate: rDue, done: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    if (inputEl) inputEl.value = '';
    var ok = el('student-log-ok');
    if (ok) { ok.style.display = 'block'; setTimeout(function(){ ok.style.display = 'none'; }, 3000); }
    toast(subj + ' logged! Revision set for ' + rDue);
  });
}
