@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.fi{animation:fi .3s ease}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:12px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}

.bp{background:var(--p);color:#fff}.bp:hover{background:#2E75B6}
.ba{background:var(--a);color:#fff}.ba:hover{background:#a34a0e}

.inp:focus{border-color:var(--p)}
.lbl{font-size:13px;font-weight:600;color:#334155;display:block;margin-bottom:6px}
.pb{height:8px;background:#e2e8f0;border-radius:9999px;overflow:hidden}
.pf{height:100%;border-radius:9999px;transition:width .5s ease}
.nav{background:var(--p);color:#fff;padding:0 20px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.12)}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;padding:28px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.tree-item{padding:6px 10px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;font-size:13px}

.note-card{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px;background:#fff;transition:all .15s}

@media(max-width:768px){.main{margin-left:0;padding:16px}.sb{display:none}.mn{display:flex!important}.g3,.g4{grid-template-columns:repeat(2,1fr)}}

function MainApp({user}){
  const[profile,setProfile]=useState(null);
  const[page,setPage]=useState("dashboard");

  const[revisions,setRevisions]=useState([]);
  const[notes,setNotes]=useState([]);
  const[syllabus,setSyllabus]=useState({});
  const[calEvents,setCalEvents]=useState([]);
  const[flashcards,setFlashcards]=useState([]);
  const[quizzes,setQuizzes]=useState([]);
  const[tasks,setTasks]=useState([]);
  const[studyNotes,setStudyNotes]=useState([]);
  const[users,setUsers]=useState([]);
  const[onlineUsers,setOnlineUsers]=useState([]);
  const[toast,setToast]=useState("");
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(""),3000)};

  useEffect(()=>{
    db.collection("users").doc(user.uid).get().then(d=>{if(d.exists)setProfile(d.data());});
    db.collection("users").doc(user.uid).update({online:true});
    const uns=[];
    uns.push(db.collection("topics").orderBy("createdAt","desc").limit(100).onSnapshot(s=>setTopics(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("revisions").orderBy("dueDate","asc").onSnapshot(s=>setRevisions(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("notes").orderBy("createdAt","desc").limit(30).onSnapshot(s=>setNotes(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("syllabus").doc("shared").onSnapshot(s=>{if(s.exists)setSyllabus(s.data().data||{});}));
    uns.push(db.collection("calEvents").orderBy("date","asc").onSnapshot(s=>setCalEvents(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("flashcards").orderBy("createdAt","desc").onSnapshot(s=>setFlashcards(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("quizzes").orderBy("createdAt","desc").onSnapshot(s=>setQuizzes(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("tasks").orderBy("createdAt","desc").onSnapshot(s=>setTasks(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("studyNotes").orderBy("createdAt","desc").onSnapshot(s=>setStudyNotes(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("users").onSnapshot(s=>setUsers(s.docs.map(d=>({id:d.id,...d.data()})))));
    uns.push(db.collection("users").where("online","==",true).onSnapshot(s=>setOnlineUsers(s.docs.map(d=>d.data().name).filter(Boolean))));
    return()=>{uns.forEach(u=>u());db.collection("users").doc(user.uid).update({online:false});};
  },[user.uid]);

  const logout=async()=>{await db.collection("users").doc(user.uid).update({online:false});await auth.signOut();};
  const isT=profile?.role==="teacher"||profile?.role==="admin";

  // Core functions
  const logTopic=async(entry)=>{
    const rd=new Date(entry.date);rd.setDate(rd.getDate()+7);
    const rDue=rd.toISOString().split("T")[0];
    await db.collection("topics").add({...entry,revisionDue:rDue,loggedBy:profile?.name||"Teacher",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    if(entry.status==="taught"){await db.collection("revisions").add({subject:entry.subject,chapter:entry.chapter,topic:entry.topic,subtopic:entry.subtopic||"",taughtDate:entry.date,dueDate:rDue,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
    const upd=JSON.parse(JSON.stringify(syllabus));
    if(!upd[entry.subject])upd[entry.subject]={chapters:DS[entry.subject]?.chapters||[],progress:{}};
    if(!upd[entry.subject].progress)upd[entry.subject].progress={};
    const key=`${entry.subject}||${entry.chapter}||${entry.topic}${entry.subtopic?"||"+entry.subtopic:""}`;
    upd[entry.subject].progress[key]={status:entry.status,date:entry.date};
    await db.collection("syllabus").doc("shared").set({data:upd},{merge:true});
    showToast("Topic saved! Revision set for "+rDue);
  };
  const markRevised=async(id)=>{await db.collection("revisions").doc(id).update({done:true,doneDate:new Date().toISOString().split("T")[0]});showToast("Marked as revised!");};
  const addNote=async(text)=>{await db.collection("notes").add({text,author:profile?.name||"Teacher",createdAt:firebase.firestore.FieldValue.serverTimestamp()});};
  const addCalEvent=async(ev)=>{await db.collection("calEvents").add({...ev,createdBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Event added!");};
  const deleteCalEvent=async(id)=>{await db.collection("calEvents").doc(id).delete();showToast("Event deleted.");};
  const addFlashcard=async(fc)=>{await db.collection("flashcards").add({...fc,createdBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Flashcard added!");};
  const addQuiz=async(qz)=>{await db.collection("quizzes").add({...qz,createdBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Quiz question added!");};
  const addTask=async(tk)=>{await db.collection("tasks").add({...tk,createdBy:profile?.name,done:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Task assigned!");};
  const toggleTask=async(id,done)=>{await db.collection("tasks").doc(id).update({done:!done,doneDate:!done?new Date().toISOString().split("T")[0]:null});};
  const uploadSyllabus=async(subj,chapters)=>{const upd=JSON.parse(JSON.stringify(syllabus));if(!upd[subj])upd[subj]={};upd[subj].chapters=chapters;upd[subj].progress=upd[subj].progress||{};await db.collection("syllabus").doc("shared").set({data:upd},{merge:true});showToast("Syllabus updated for "+subj+"!");};
  const addStudyNote=async(note)=>{await db.collection("studyNotes").add({...note,uploadedBy:profile?.name,createdAt:firebase.firestore.FieldValue.serverTimestamp()});showToast("Study material added!");};
  const deleteStudyNote=async(id)=>{await db.collection("studyNotes").doc(id).delete();showToast("Deleted.");};
  const addUser=async(userData)=>{
    try{
      const c=await auth.createUserWithEmailAndPassword(userData.email,userData.password);
      await db.collection("users").doc(c.user.uid).set({name:userData.name,email:userData.email,role:userData.role,avatar:userData.name[0].toUpperCase(),online:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      await auth.signOut();
      await auth.signInWithEmailAndPassword(profile?.email||"",userData._currentPass||"");
      showToast("User "+userData.name+" added successfully!");
      return true;
    }catch(e){showToast("Error: "+e.message);return false;}
  };

  const todayRevs=revisions.filter(r=>{const t=new Date().toISOString().split("T")[0];return!r.done&&r.dueDate<=t;});
  const navT=[{id:"dashboard",l:"Dashboard",i:"📊"},{id:"calendar",l:"Calendar",i:"📅"},{id:"log",l:"Log Topic",i:"✏️"},{id:"syllabus",l:"Syllabus",i:"📚"},{id:"studynotes",l:"Study Notes",i:"📎"},{id:"revision",l:"Revisions",i:"🔄"},{id:"notes",l:"Team Notes",i:"💬"},{id:"content",l:"Flashcards & Quiz",i:"🎯"},{id:"tasks",l:"Tasks",i:"✅"},{id:"users",l:"Manage Users",i:"👥"},{id:"timetable",l:"Timetable",i:"🗓️"}];
  const navC=[{id:"dashboard",l:"Dashboard",i:"🏠"},{id:"calendar",l:"Calendar",i:"📅"},{id:"syllabus",l:"My Syllabus",i:"📚"},{id:"studynotes",l:"Study Notes",i:"📎"},{id:"revision",l:"Revisions",i:"🔄"},{id:"learn",l:"Learn",i:"🎯"},{id:"tasks",l:"My Tasks",i:"✅"}];
  const nav=isT?navT:navC;
  const props={profile,topics,revisions,notes,syllabus,calEvents,flashcards,quizzes,tasks,studyNotes,users,onlineUsers,todayRevs,logTopic,markRevised,addNote,addCalEvent,deleteCalEvent,addFlashcard,addQuiz,addTask,toggleTask,uploadSyllabus,addStudyNote,deleteStudyNote,addUser,showToast,isT};

  const renderPage=()=>{
    switch(page){
      case"dashboard":return<Dashboard {...props} setPage={setPage}/>;
      case"calendar":return<CalendarPage {...props}/>;
      case"log":return<LogTopic {...props}/>;
      case"syllabus":return<SyllabusPage {...props}/>;
      case"studynotes":return<StudyNotesPage {...props}/>;
      case"revision":return<RevisionPage {...props}/>;
      case"notes":return<NotesPage {...props}/>;
      case"content":return<ContentPage {...props}/>;
      case"learn":return<LearnPage {...props}/>;
      case"tasks":return<TasksPage {...props}/>;
      case"users":return<UsersPage {...props}/>;
      case"timetable":return<TimetablePage/>;
      default:return<Dashboard {...props} setPage={setPage}/>;
    }
  };

  return(
    <div>
      <nav className="nav">
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:22}}>🎓</span>
          <span style={{fontFamily:"sans-serif",fontSize:18,fontWeight:800}}>Dugu EduTrack</span>
          <span style={{fontSize:10,background:"rgba(255,255,255,0.2)",padding:"2px 8px",borderRadius:9999,fontWeight:600}}>v3</span>
          {onlineUsers.length>0&&<span style={{fontSize:11,background:"rgba(34,197,94,0.2)",color:"#86efac",padding:"2px 8px",borderRadius:9999,fontWeight:600}}>{onlineUsers.length} online</span>}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:30,height:30,borderRadius:"50%",background:"rgba(255,255,255,0.2)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:13}}>{profile?.avatar||"?"}</div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end"}}><span style={{fontWeight:700,fontSize:13}}>{profile?.name||"..."}</span><span style={{fontSize:10,opacity:.75,textTransform:"capitalize"}}>{profile?.role}</span></div>
          <button onClick={logout} style={{background:"rgba(255,255,255,0.15)",color:"white",border:"none",padding:"5px 12px",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600,marginLeft:6}}>Exit</button>
        </div>
      </nav>
      <div className="sb">
        <div style={{padding:"6px 16px 10px",borderBottom:"1px solid #e2e8f0",marginBottom:6,fontSize:11,fontWeight:700,color:"#64748b",letterSpacing:1}}>{isT?"TEACHER PORTAL":"STUDENT PORTAL"}</div>
        {nav.map(item=><div key={item.id} className={`si ${page===item.id?"act":""}`} onClick={()=>setPage(item.id)}><span style={{fontSize:16}}>{item.i}</span><span>{item.l}</span></div>)}
        <div style={{padding:"12px 16px",position:"absolute",bottom:0,left:0,right:0,borderTop:"1px solid #e2e8f0",fontSize:10,color:"#64748b",textAlign:"center"}}><span style={{width:6,height:6,borderRadius:"50%",background:"#22c55e",display:"inline-block",marginRight:4}}/>Live Sync · Baibhav · Std 5A</div>
      </div>
      <div className="main">{renderPage()}</div>
      <div className="mn" style={{display:"none"}}>{nav.slice(0,5).map(item=><div key={item.id} className={`mi ${page===item.id?"act":""}`} onClick={()=>setPage(item.id)}><span style={{fontSize:18}}>{item.i}</span><span>{item.l}</span></div>)}</div>
      {toast&&<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:"#1a202c",color:"#fff",padding:"10px 22px",borderRadius:9999,fontSize:13,fontWeight:500,zIndex:999,boxShadow:"0 8px 32px rgba(0,0,0,.16)",whiteSpace:"nowrap"}}>{toast}</div>}
    </div>
  );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({profile,topics,todayRevs,onlineUsers,tasks,calEvents,syllabus,setPage}){
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const tn=days[new Date().getDay()];
  const TT={Monday:["English","Odia","Maths","SST","Science","GK","Games","Yoga"],Tuesday:["English","Hindi","Maths","Science","SST","Odia","Art","CSPD"],Wednesday:["English","Maths","Science","Hindi","Odia","SST","Music","GK"],Thursday:["English","Science","SST","Maths","Hindi","Maths Lab","Comp Lab","Dance"],Friday:["English","GK","Hindi","Odia","Maths","Science","SST","Library"],Saturday:["English","SST","Odia","Science","Maths","Hindi","Comp","Art"]};
  const ts=TT[tn]||[];
  const todayStr=new Date().toISOString().split("T")[0];
  const todayEvents=calEvents.filter(e=>e.date===todayStr);
  const pendingTasks=tasks.filter(t=>!t.done).length;
  const totalTopics=Object.values(DS).reduce((s,v)=>s+v.chapters.reduce((a,c)=>a+c.topics.reduce((b,t)=>b+1+(t.subtopics?.length||0),0),0),0);
  const taughtTopics=Object.values(syllabus).reduce((s,v)=>s+Object.keys(v.progress||{}).filter(k=>v.progress[k].status==="taught").length,0);
  const overallPct=totalTopics?Math.round(taughtTopics/totalTopics*100):0;
  const tutorSlots=calEvents.filter(e=>e.type==="tutor"&&e.date>=todayStr).slice(0,3);
  return(
    <div className="fi">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
        <div className="pt">Welcome, {profile?.name||"..."}! 👋</div>
        {onlineUsers.length>0&&<div style={{background:"#C6EFCE",color:"#276221",padding:"5px 12px",borderRadius:9999,fontSize:12,fontWeight:600}}><span style={{width:6,height:6,borderRadius:"50%",background:"#22c55e",display:"inline-block",marginRight:4}}/>Online: {onlineUsers.join(", ")}</div>}
      </div>
      <div className="ps">{new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
      <div className="g4" style={{marginBottom:20}}>
        {[{v:topics.length,l:"Topics Taught",c:"#1F4E79",i:"📚"},{v:todayRevs.length,l:"Revisions Due",c:"#C55A11",i:"🔄"},{v:pendingTasks,l:"Pending Tasks",c:"#4B2E83",i:"✅"},{v:overallPct+"%",l:"Overall Progress",c:"#276221",i:"📈"}].map((s,i)=>(
          <div key={i} className="card" style={{borderTop:`4px solid ${s.c}`}}>
            <div style={{fontSize:22,marginBottom:4}}>{s.i}</div>
            <div style={{fontSize:28,fontWeight:800,color:s.c}}>{s.v}</div>
            <div style={{fontSize:12,color:"#64748b",fontWeight:500}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div className="g2" style={{marginBottom:20}}>
        <div className="card">
          <div className="st">🗓️ Today — {tn}</div>
          {ts.length>0?<div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:12}}>{ts.map((s,i)=><span key={i} style={{padding:"4px 10px",borderRadius:9999,fontSize:12,fontWeight:600,background:"#DCE6F1",color:"#1F4E79"}}>P{i+1}: {s}</span>)}</div>:<p style={{color:"#64748b",fontSize:13,marginBottom:12}}>No school today!</p>}
          {todayEvents.length>0&&<div style={{borderTop:"1px solid #e2e8f0",paddingTop:10,marginBottom:10}}><div style={{fontSize:12,fontWeight:600,color:"#64748b",marginBottom:6}}>TODAY'S EVENTS</div>{todayEvents.map(e=><div key={e.id} style={{fontSize:13,padding:"4px 0",color:"#334155"}}>• {e.title}{e.time?" at "+e.time:""}{e.meetLink&&<a href={e.meetLink} target="_blank" style={{marginLeft:8,color:"#1F4E79",fontSize:11,fontWeight:600}}>Join Meeting →</a>}</div>)}</div>}
          <button onClick={()=>setPage("log")} style={{width:"100%",padding:"8px",background:"#1F4E79",color:"white",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:600}}>✏️ Log Today Topics</button>
        </div>
        <div className="card">
          <div className="st">📊 Subject Progress</div>
          {SUBS.slice(0,5).map(sub=>{
            const allT=DS[sub].chapters.reduce((a,c)=>a+c.topics.reduce((b,t)=>b+1+(t.subtopics?.length||0),0),0);
            const done=Object.keys(syllabus[sub]?.progress||{}).filter(k=>syllabus[sub].progress[k].status==="taught").length;
            const pct=allT?Math.round(done/allT*100):0;
            return(<div key={sub} style={{marginBottom:10}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:12,fontWeight:600}}>{sub}</span><span style={{fontSize:11,color:"#64748b"}}>{done}/{allT} · {pct}%</span></div>
              <div className="pb"><div className="pf" style={{width:`${pct}%`,background:SC[sub]||"#1F4E79"}}/></div>
            </div>);
          })}
          <button onClick={()=>setPage("syllabus")} style={{marginTop:8,width:"100%",padding:"6px",background:"transparent",color:"#1F4E79",border:"1px solid #1F4E79",borderRadius:8,cursor:"pointer",fontSize:12,fontWeight:600}}>View All Subjects →</button>
        </div>
      </div>
      <div className="g2">
        <div className="card">
          <div className="st">🔄 Revisions Due Today {todayRevs.length>0&&<span className="tag td2" style={{marginLeft:6}}>{todayRevs.length}</span>}</div>
          {todayRevs.length===0?<p style={{color:"#64748b",fontSize:13,textAlign:"center",padding:"16px 0"}}>No revisions due today!</p>:todayRevs.slice(0,4).map(r=>(
            <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0",marginBottom:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#C55A11",flexShrink:0}}/>
              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{r.subject}</div><div style={{fontSize:11,color:"#64748b"}}>{r.topic}{r.subtopic?" → "+r.subtopic:""}</div></div>
              <span className="tag tw">Due</span>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="st">📹 Upcoming Tutor Sessions</div>
          {tutorSlots.length===0?<div style={{textAlign:"center",padding:"16px 0",color:"#64748b",fontSize:13}}><div style={{fontSize:32,marginBottom:8}}>📹</div>No tutor sessions scheduled.<br/><button onClick={()=>setPage("calendar")} style={{marginTop:8,background:"none",border:"none",color:"#1F4E79",cursor:"pointer",fontSize:12,fontWeight:600,textDecoration:"underline"}}>Schedule one →</button></div>:tutorSlots.map(e=>(
            <div key={e.id} className="tutor-slot" style={{marginBottom:10}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div><div style={{fontSize:13,fontWeight:700,color:"#4B2E83"}}>{e.title}</div><div style={{fontSize:12,color:"#64748b"}}>{e.date} {e.time&&"at "+e.time}</div>{e.subject&&<div style={{fontSize:11,color:"#64748b"}}>📚 {e.subject}</div>}</div>
                {e.meetLink&&<a href={e.meetLink} target="_blank" style={{padding:"6px 12px",background:"#4B2E83",color:"white",borderRadius:8,fontSize:12,fontWeight:600,textDecoration:"none"}}>Join</a>}
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── FEATURE 5: Enhanced Calendar with Tutor Slots ─────────────────────────────
function CalendarPage({calEvents,addCalEvent,deleteCalEvent,topics,isT}){
  const today=new Date();
  const[year,setYear]=useState(today.getFullYear());
  const[month,setMonth]=useState(today.getMonth());
  const[selected,setSelected]=useState(today.toISOString().split("T")[0]);
  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({title:"",type:"study",subject:"",time:"",endTime:"",notes:"",meetLink:"",tutorName:"",recurring:"none"});
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const MN=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const todayStr=today.toISOString().split("T")[0];
  const getDS=(d)=>`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const evOnDate=(d)=>calEvents.filter(e=>e.date===getDS(d));
  const tpOnDate=(d)=>topics.filter(t=>t.date===getDS(d));
  const selEvs=calEvents.filter(e=>e.date===selected);
  const selTps=topics.filter(t=>t.date===selected);
  const TC={study:"#1F4E79",exam:"#9C0006",revision:"#C55A11",activity:"#276221",holiday:"#4B2E83",tutor:"#0891b2",meeting:"#7c3aed"};
  const TI={study:"📚",exam:"📝",revision:"🔄",activity:"⚽",holiday:"🏖️",tutor:"📹",meeting:"🤝"};
  const save=async()=>{
    if(!form.title)return;
    await addCalEvent({...form,date:selected});
    setForm({title:"",type:"study",subject:"",time:"",endTime:"",notes:"",meetLink:"",tutorName:"",recurring:"none"});
    setShowAdd(false);
  };
  return(
    <div className="fi">
      <div className="pt">📅 Study Calendar</div>
      <div className="ps">Plan studies, schedule tutor sessions and set meeting links</div>
      <div className="g2">
        <div className="card">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <button className="btn bg2 bsm" onClick={()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}}>←</button>
            <span style={{fontWeight:700,fontSize:16}}>{MN[month]} {year}</span>
            <button className="btn bg2 bsm" onClick={()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}}>→</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:8}}>
            {["Su","Mo","Tu","We","Th","Fr","Sa"].map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"#64748b",padding:"4px 0"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
            {Array(firstDay).fill(null).map((_,i)=><div key={"e"+i}/>)}
            {Array(daysInMonth).fill(null).map((_,i)=>{
              const d=i+1;const ds=getDS(d);
              const evs=evOnDate(d);const tps=tpOnDate(d);
              const isToday=ds===todayStr;const isSel=ds===selected;
              const hasTutor=evs.some(e=>e.type==="tutor"||e.type==="meeting");
              return(
                <div key={d} className="cal-day" onClick={()=>setSelected(ds)}
                  style={{background:isToday?"#1F4E79":isSel?"#DCE6F1":"transparent",color:isToday?"white":isSel?"#1F4E79":"inherit",fontWeight:isToday||isSel?700:400}}>
                  {d}
                  {(evs.length>0||tps.length>0)&&<div style={{display:"flex",gap:2,marginTop:2}}>
                    {tps.length>0&&<span style={{width:4,height:4,borderRadius:"50%",background:isToday?"white":"#276221",display:"inline-block"}}/>}
                    {evs.length>0&&<span style={{width:4,height:4,borderRadius:"50%",background:isToday?"white":hasTutor?"#0891b2":"#C55A11",display:"inline-block"}}/>}
                  </div>}
                </div>
              );
            })}
          </div>
          <div style={{marginTop:12,display:"flex",gap:6,flexWrap:"wrap"}}>
            {Object.entries(TC).map(([t,c])=><span key={t} style={{fontSize:10,display:"flex",alignItems:"center",gap:3}}><span style={{width:7,height:7,borderRadius:"50%",background:c,display:"inline-block"}}/>{t}</span>)}
          </div>
        </div>
        <div>
          <div className="card" style={{marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
              <div className="st" style={{marginBottom:0}}>{new Date(selected+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}</div>
              {isT&&<button className="btn bp bsm" onClick={()=>setShowAdd(true)}>+ Add Event</button>}
            </div>
            {selEvs.length===0&&selTps.length===0?(
              <div style={{textAlign:"center",padding:"20px 0",color:"#64748b",fontSize:13}}>
                <div style={{fontSize:32,marginBottom:8}}>📭</div>No events for this day.

                        {e.time&&<div style={{fontSize:12,color:"#64748b"}}>⏰ {e.time}{e.endTime?" – "+e.endTime:""}</div>}
                        {e.subject&&<div style={{fontSize:12,color:"#64748b"}}>📚 {e.subject}</div>}
                        {e.tutorName&&<div style={{fontSize:12,color:"#64748b"}}>👨‍🏫 Tutor: {e.tutorName}</div>}

                      </div>
                      {isT&&<button onClick={()=>deleteCalEvent(e.id)} style={{background:"none",border:"none",cursor:"pointer",color:"#9C0006",fontSize:16,padding:"0 4px",flexShrink:0}}>✕</button>}
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
          <div className="card">
            <div className="st">📌 Upcoming Events</div>
            {calEvents.filter(e=>e.date>=todayStr).slice(0,6).map(e=>(
              <div key={e.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid #f1f5f9"}}>
                <div style={{width:36,height:36,borderRadius:8,background:`${TC[e.type]||"#1F4E79"}20`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:TC[e.type]||"#1F4E79",flexShrink:0,lineHeight:1.2}}><span>{e.date.slice(8)}</span><span style={{fontSize:9}}>{MN[parseInt(e.date.slice(5,7))-1].slice(0,3)}</span></div>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{TI[e.type]||"📌"} {e.title}</div><div style={{fontSize:11,color:"#64748b"}}>{e.time||e.type}{e.tutorName?" · "+e.tutorName:""}</div></div>
                {e.meetLink&&<a href={e.meetLink} target="_blank" style={{fontSize:11,color:"#0891b2",fontWeight:600,textDecoration:"none"}}>Join →</a>}
              </div>
            ))}
            {calEvents.filter(e=>e.date>=todayStr).length===0&&<p style={{color:"#64748b",fontSize:13,textAlign:"center",padding:"12px 0"}}>No upcoming events</p>}
          </div>
        </div>
      </div>
      {showAdd&&(
        <div className="modal-bg" onClick={()=>setShowAdd(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}><h3 style={{fontSize:18,fontWeight:700}}>Add Event — {selected}</h3><button onClick={()=>setShowAdd(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div style={{marginBottom:12}}><label className="lbl">Event Title *</label><input className="inp" placeholder="e.g. Maths Tutor Session, English Test" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))}/></div>
            <div className="g2" style={{marginBottom:12}}>
              <div><label className="lbl">Type</label><select className="inp" style={{appearance:"none"}} value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}><option value="study">📚 Study</option><option value="exam">📝 Exam/Test</option><option value="revision">🔄 Revision</option><option value="activity">⚽ Activity</option><option value="holiday">🏖️ Holiday</option><option value="tutor">📹 Tutor Session</option><option value="meeting">🤝 Meeting</option></select></div>
              <div><label className="lbl">Subject</label><select className="inp" style={{appearance:"none"}} value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value}))}><option value="">-- Select --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            </div>
            <div className="g2" style={{marginBottom:12}}>

              <div><label className="lbl">End Time</label><input className="inp" type="time" value={form.endTime} onChange={e=>setForm(f=>({...f,endTime:e.target.value}))}/></div>

            {(form.type==="tutor"||form.type==="meeting")&&(
              <>
                <div style={{marginBottom:12}}><label className="lbl">Tutor / Host Name</label><input className="inp" placeholder="e.g. Saswat, Swagat" value={form.tutorName} onChange={e=>setForm(f=>({...f,tutorName:e.target.value}))}/></div>
                <div style={{marginBottom:12}}>
                  <label className="lbl">Meeting Link (Google Meet / Zoom / Teams)</label>

    </div>
  );
}

// ── FEATURE 1: Enhanced Syllabus Editor with Topics & Sub-topics ──────────────
function SyllabusPage({syllabus,uploadSyllabus,isT}){
  const[selSub,setSelSub]=useState(SUBS[0]);
  const[showEdit,setShowEdit]=useState(false);
  const[editChs,setEditChs]=useState([]);
  const[newCh,setNewCh]=useState("");
  const[newTp,setNewTp]=useState({ch:"",name:""});
  const[newSt,setNewSt]=useState({ch:"",tp:"",name:""});
  const[expandedCh,setExpandedCh]=useState({});
  const customChs=syllabus[selSub]?.chapters||DS[selSub]?.chapters||[];
  const progress=syllabus[selSub]?.progress||{};

  // Count all items (topics + subtopics)
  const countAll=(chs)=>chs.reduce((a,c)=>a+c.topics.reduce((b,t)=>b+1+(t.subtopics?.length||0),0),0);
  const allT=countAll(customChs);
  const taughtT=Object.keys(progress).filter(k=>progress[k].status==="taught").length;
  const pct=allT?Math.round(taughtT/allT*100):0;

  const startEdit=()=>{setEditChs(JSON.parse(JSON.stringify(customChs)));setShowEdit(true);};
  const addCh=()=>{if(!newCh.trim())return;setEditChs(p=>[...p,{ch:newCh.trim(),topics:[]}]);setNewCh("");};
  const addTp=()=>{if(!newTp.ch||!newTp.name.trim())return;setEditChs(p=>p.map(c=>c.ch===newTp.ch?{...c,topics:[...c.topics,{name:newTp.name.trim(),subtopics:[]}]}:c));setNewTp({ch:"",name:""});};
  const addSt=()=>{if(!newSt.ch||!newSt.tp||!newSt.name.trim())return;setEditChs(p=>p.map(c=>c.ch===newSt.ch?{...c,topics:c.topics.map(t=>t.name===newSt.tp?{...t,subtopics:[...(t.subtopics||[]),newSt.name.trim()]}:t)}:c));setNewSt({ch:"",tp:"",name:""});};
  const remTp=(ch,tp)=>setEditChs(p=>p.map(c=>c.ch===ch?{...c,topics:c.topics.filter(t=>t.name!==tp)}:c));
  const remSt=(ch,tp,st)=>setEditChs(p=>p.map(c=>c.ch===ch?{...c,topics:c.topics.map(t=>t.name===tp?{...t,subtopics:(t.subtopics||[]).filter(s=>s!==st)}:t)}:c));
  const remCh=(ch)=>setEditChs(p=>p.filter(c=>c.ch!==ch));
  const saveEdit=async()=>{await uploadSyllabus(selSub,editChs);setShowEdit(false);};
  const toggleCh=(ch)=>setExpandedCh(p=>({...p,[ch]:!p[ch]}));

  return(
    <div className="fi">
      <div className="pt">📚 Syllabus & Progress</div>
      <div className="ps">Track topic and sub-topic completion for each subject</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
        {SUBS.map(s=>{
          const chs=syllabus[s]?.chapters||DS[s]?.chapters||[];
          const tot=countAll(chs);
          const done=Object.keys(syllabus[s]?.progress||{}).filter(k=>syllabus[s].progress[k].status==="taught").length;
          const p=tot?Math.round(done/tot*100):0;
          return(<button key={s} onClick={()=>setSelSub(s)} style={{padding:"8px 14px",borderRadius:10,fontSize:12,fontWeight:600,border:`2px solid ${SC[s]||"#1F4E79"}`,cursor:"pointer",background:selSub===s?(SC[s]||"#1F4E79"):"white",color:selSub===s?"white":(SC[s]||"#1F4E79")}}>{s} ({p}%)</button>);
        })}
      </div>
      <div className="card">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,padding:"16px 20px",background:SL[selSub]||"#f8fafc",borderRadius:12,margin:"-20px -20px 16px"}}>
          <div><div style={{fontSize:20,fontWeight:800,color:SC[selSub]||"#1F4E79"}}>{selSub}</div><div style={{fontSize:13,color:"#475569"}}>{taughtT}/{allT} items taught</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:36,fontWeight:900,color:SC[selSub]||"#1F4E79"}}>{pct}%</div>{isT&&<button className="btn bsm" style={{background:SC[selSub]||"#1F4E79",color:"white",marginTop:4}} onClick={startEdit}>✏️ Edit Syllabus</button>}</div>
        </div>
        <div style={{marginBottom:20}}>
          <div className="pb" style={{height:12}}><div className="pf" style={{width:`${pct}%`,background:SC[selSub]||"#1F4E79"}}/></div>
          <div style={{display:"flex",justifyContent:"space-between",marginTop:6,fontSize:12,color:"#64748b"}}><span>✅ {taughtT} taught</span><span>⏳ {allT-taughtT} remaining</span></div>
        </div>
        {customChs.map(ch=>{
          const chAll=ch.topics.reduce((a,t)=>a+1+(t.subtopics?.length||0),0);
          const chDone=ch.topics.reduce((a,t)=>{const tk=`${selSub}||${ch.ch}||${t.name}`;const stDone=(t.subtopics||[]).filter(st=>progress[`${selSub}||${ch.ch}||${t.name}||${st}`]?.status==="taught").length;return a+(progress[tk]?.status==="taught"?1:0)+stDone;},0);
          const chP=chAll?Math.round(chDone/chAll*100):0;
          const isExp=expandedCh[ch.ch]!==false;
          return(
            <div key={ch.ch} style={{marginBottom:12,border:"1px solid #e2e8f0",borderRadius:12,overflow:"hidden"}}>
              <div style={{padding:"10px 14px",background:"#f8fafc",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer"}} onClick={()=>toggleCh(ch.ch)}>
                <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:14}}>{isExp?"▼":"▶"}</span><span style={{fontWeight:700,fontSize:14,color:SC[selSub]||"#1F4E79"}}>{ch.ch}</span><span style={{fontSize:12,color:"#64748b"}}>({ch.topics.length} topics)</span></div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:80}}><div className="pb" style={{height:6}}><div className="pf" style={{width:`${chP}%`,background:SC[selSub]||"#1F4E79"}}/></div></div>
                  <span style={{fontSize:12,fontWeight:600,color:SC[selSub]||"#1F4E79"}}>{chP}%</span>
                </div>
              </div>
              {isExp&&<div style={{padding:"8px 14px"}}>
                {ch.topics.map(tp=>{
                  const tpKey=`${selSub}||${ch.ch}||${tp.name}`;
                  const tpSt=progress[tpKey]?.status;
                  const stDone=(tp.subtopics||[]).filter(st=>progress[`${tpKey}||${st}`]?.status==="taught").length;
                  const stTotal=(tp.subtopics||[]).length;
                  return(
                    <div key={tp.name} style={{marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,padding:"6px 8px",borderRadius:8,background:tpSt==="taught"?`${SL[selSub]||"#f8fafc"}`:"#f8fafc",border:`1px solid ${tpSt==="taught"?(SC[selSub]||"#1F4E79")+"33":"#e2e8f0"}`}}>
                        <div style={{width:20,height:20,borderRadius:"50%",background:tpSt==="taught"?(SC[selSub]||"#1F4E79"):"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:tpSt==="taught"?"white":"#64748b",flexShrink:0,fontWeight:700}}>{tpSt==="taught"?"✓":"○"}</div>
                        <span style={{fontSize:13,flex:1,fontWeight:tpSt==="taught"?600:400,color:tpSt==="taught"?(SC[selSub]||"#1F4E79"):"#334155"}}>{tp.name}</span>
                        {stTotal>0&&<span style={{fontSize:11,color:"#64748b"}}>{stDone}/{stTotal} subtopics</span>}
                        {progress[tpKey]?.date&&<span style={{fontSize:10,color:"#94a3b8"}}>{progress[tpKey].date}</span>}
                        <span className={`tag ${tpSt==="taught"?"ts":"tp"}`}>{tpSt==="taught"?"Done":"Pending"}</span>
                      </div>
                      {(tp.subtopics||[]).length>0&&(
                        <div style={{marginLeft:28,marginTop:4}}>
                          {(tp.subtopics||[]).map(st=>{
                            const stKey=`${tpKey}||${st}`;
                            const stSt=progress[stKey]?.status;
                            return(
                              <div key={st} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 8px",borderRadius:6,marginBottom:3,background:stSt==="taught"?"#f0fdf4":"#fafafa",border:`1px solid ${stSt==="taught"?"#86efac":"#f1f5f9"}`}}>
                                <div style={{width:14,height:14,borderRadius:"50%",background:stSt==="taught"?"#276221":"#e2e8f0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:stSt==="taught"?"white":"#94a3b8",flexShrink:0}}>✓</div>
                                <span style={{fontSize:12,flex:1,color:stSt==="taught"?"#276221":"#64748b"}}>{st}</span>
                                {stSt==="taught"&&<span style={{fontSize:10,color:"#276221",fontWeight:600}}>✅</span>}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>}
            </div>
          );
        })}
      </div>

      {/* Edit Syllabus Modal */}
      {showEdit&&(
        <div className="modal-bg" onClick={()=>setShowEdit(false)}>
          <div className="modal modal-lg" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><h3 style={{fontSize:18,fontWeight:700}}>Edit Syllabus — {selSub}</h3><button onClick={()=>setShowEdit(false)} style={{background:"none",border:"none",cursor:"pointer",fontSize:20,color:"#64748b"}}>✕</button></div>
            <div style={{maxHeight:300,overflowY:"auto",marginBottom:14,border:"1px solid #e2e8f0",borderRadius:10,padding:10}}>
              {editChs.map(ch=>(
                <div key={ch.ch} style={{marginBottom:10}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"6px 10px",background:"#f8fafc",borderRadius:8,marginBottom:4}}>
                    <span style={{fontWeight:700,fontSize:13,color:"#1F4E79"}}>{ch.ch}</span>
                    <button onClick={()=>remCh(ch.ch)} style={{background:"none",border:"none",cursor:"pointer",color:"#9C0006",fontSize:13}}>Remove Chapter</button>
                  </div>
                  {ch.topics.map(tp=>(
                    <div key={tp.name} style={{marginLeft:12,marginBottom:6}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"4px 8px",background:"#f0f7ff",borderRadius:6,marginBottom:3}}>
                        <span style={{fontSize:12,fontWeight:600}}>📌 {tp.name}</span>
                        <button onClick={()=>remTp(ch.ch,tp.name)} style={{background:"none",border:"none",cursor:"pointer",color:"#9C0006",fontSize:12}}>✕</button>
                      </div>
                      {(tp.subtopics||[]).map(st=>(
                        <div key={st} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"3px 8px",marginLeft:12,marginBottom:2}}>
                          <span style={{fontSize:11,color:"#64748b"}}>→ {st}</span>
                          <button onClick={()=>remSt(ch.ch,tp.name,st)} style={{background:"none",border:"none",cursor:"pointer",color:"#9C0006",fontSize:11}}>✕</button>
                        </div>
                      ))}
                    </div>
                  ))}
                </div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div style={{border:"1px solid #e2e8f0",borderRadius:10,padding:12}}>
                <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:"#1F4E79"}}>Add New Chapter</div>
                <div style={{display:"flex",gap:8}}><input className="inp" placeholder="e.g. Ch-8" value={newCh} onChange={e=>setNewCh(e.target.value)} style={{flex:1,fontSize:13}}/><button className="btn bp bsm" onClick={addCh} disabled={!newCh}>Add</button></div>
              </div>
              <div style={{border:"1px solid #e2e8f0",borderRadius:10,padding:12}}>
                <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:"#1F4E79"}}>Add Topic to Chapter</div>
                <select className="inp" style={{appearance:"none",fontSize:13,marginBottom:6}} value={newTp.ch} onChange={e=>setNewTp(f=>({...f,ch:e.target.value}))}><option value="">Select Chapter</option>{editChs.map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select>
                <div style={{display:"flex",gap:8}}><input className="inp" placeholder="Topic name" value={newTp.name} onChange={e=>setNewTp(f=>({...f,name:e.target.value}))} style={{flex:1,fontSize:13}}/><button className="btn bp bsm" onClick={addTp} disabled={!newTp.ch||!newTp.name}>Add</button></div>
              </div>
            </div>
            <div style={{border:"1px solid #e2e8f0",borderRadius:10,padding:12,marginBottom:16}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:8,color:"#276221"}}>Add Sub-topic to Topic</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr auto",gap:8,alignItems:"end"}}>
                <select className="inp" style={{appearance:"none",fontSize:13}} value={newSt.ch} onChange={e=>setNewSt(f=>({...f,ch:e.target.value,tp:""}))}><option value="">Chapter</option>{editChs.map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select>
                <select className="inp" style={{appearance:"none",fontSize:13}} value={newSt.tp} onChange={e=>setNewSt(f=>({...f,tp:e.target.value}))} disabled={!newSt.ch}><option value="">Topic</option>{(editChs.find(c=>c.ch===newSt.ch)?.topics||[]).map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select>
                <input className="inp" placeholder="Sub-topic name" value={newSt.name} onChange={e=>setNewSt(f=>({...f,name:e.target.value}))} style={{fontSize:13}}/>
                <button className="btn bs bsm" onClick={addSt} disabled={!newSt.ch||!newSt.tp||!newSt.name}>Add</button>
              </div>
            </div>
            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowEdit(false)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={saveEdit}>Save Syllabus</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

// ── FEATURE 4: Study Notes (PDF/PPT/Links) ────────────────────────────────────
function StudyNotesPage({studyNotes,addStudyNote,deleteStudyNote,isT}){
  const[showAdd,setShowAdd]=useState(false);
  const[form,setForm]=useState({subject:"",chapter:"",topic:"",subtopic:"",title:"",type:"link",url:"",description:""});
  const[filter,setFilter]=useState({subject:"",chapter:"",topic:""});
  const[uploading,setUploading]=useState(false);
  const fileRef=useRef();

  const subChs=form.subject?(DS[form.subject]?.chapters||[]):[];
  const chTps=form.chapter?(subChs.find(c=>c.ch===form.chapter)?.topics||[]):[];
  const tpSts=form.topic?(chTps.find(t=>t.name===form.topic)?.subtopics||[]):[];

  const handleFile=async(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setUploading(true);
    try{
      const ref=storage.ref(`studyNotes/${Date.now()}_${file.name}`);
      await ref.put(file);
      const url=await ref.getDownloadURL();
      setForm(f=>({...f,url,title:f.title||file.name,type:file.name.endsWith(".pdf")?"pdf":file.name.endsWith(".pptx")||file.name.endsWith(".ppt")?"ppt":"file"}));
    }catch(err){alert("Upload failed: "+err.message);}
    setUploading(false);
  };

  const save=async()=>{

              <div><label className="lbl">Chapter</label><select className="inp" style={{appearance:"none"}} value={form.chapter} onChange={e=>setForm(f=>({...f,chapter:e.target.value,topic:"",subtopic:""}))} disabled={!form.subject}><option value="">-- Select --</option>{subChs.map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select></div>

            <div style={{display:"flex",gap:10}}><button className="btn bg2" style={{flex:1}} onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn bp" style={{flex:1}} onClick={save} disabled={!form.title||!form.subject||uploading}>Add Material</button></div>

// ── FEATURE 3: Log Topic with Sub-topic + Bulk Upload ─────────────────────────
function LogTopic({logTopic,syllabus,profile}){
  const[form,setForm]=useState({date:new Date().toISOString().split("T")[0],subject:"",chapter:"",topic:"",subtopic:"",duration:40,notes:"",status:"taught"});
  const[entries,setEntries]=useState([]);
  const[saving,setSaving]=useState(false);
  const[ok,setOk]=useState(false);
  const subChs=form.subject?(syllabus[form.subject]?.chapters||DS[form.subject]?.chapters||[]):[];
  const chTps=form.chapter?(subChs.find(c=>c.ch===form.chapter)?.topics||[]):[];
  const tpSts=form.topic?(chTps.find(t=>t.name===form.topic)?.subtopics||[]):[];
  const addEntry=()=>{if(!form.subject||!form.chapter||!form.topic)return;setEntries(p=>[...p,{...form,id:Date.now()}]);setForm(f=>({...f,chapter:"",topic:"",subtopic:"",notes:""}));};
  const submit=async()=>{
    const tl=entries.length>0?entries:[form];
    if(!tl[0].subject||!tl[0].chapter||!tl[0].topic)return;
    setSaving(true);for(const e of tl)await logTopic(e);setSaving(false);
    setOk(true);setEntries([]);
    setForm({date:new Date().toISOString().split("T")[0],subject:"",chapter:"",topic:"",subtopic:"",duration:40,notes:"",status:"taught"});
    setTimeout(()=>setOk(false),3000);
  };
  return(
    <div className="fi">
      <div className="pt">✏️ Log Today Topics</div>
      <div className="ps">Select subject → chapter → topic → sub-topic from syllabus</div>
      {ok&&<div style={{background:"#C6EFCE",color:"#276221",padding:"12px 18px",borderRadius:12,marginBottom:20,fontWeight:600,fontSize:14}}>✅ Topics saved! Revision reminders set automatically.</div>}
      <div className="g2">
        <div className="card">
          <div className="st">📝 Add Topic Entry</div>
          <div className="g2" style={{marginBottom:14}}>
            <div><label className="lbl">Date</label><input className="inp" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
            <div><label className="lbl">Status</label><select className="inp" style={{appearance:"none"}} value={form.status} onChange={e=>setForm(f=>({...f,status:e.target.value}))}><option value="taught">✅ Taught</option><option value="missed">⚠️ Missed</option><option value="partial">🔶 Partial</option></select></div>
          </div>
          <div style={{marginBottom:14}}><label className="lbl">Subject *</label><select className="inp" style={{appearance:"none"}} value={form.subject} onChange={e=>setForm(f=>({...f,subject:e.target.value,chapter:"",topic:"",subtopic:""}))}><option value="">-- Select Subject --</option>{SUBS.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
          <div style={{marginBottom:14}}><label className="lbl">Chapter *</label><select className="inp" style={{appearance:"none"}} value={form.chapter} onChange={e=>setForm(f=>({...f,chapter:e.target.value,topic:"",subtopic:""}))} disabled={!form.subject}><option value="">-- Select Chapter --</option>{subChs.map(c=><option key={c.ch} value={c.ch}>{c.ch}</option>)}</select></div>
          <div style={{marginBottom:14}}><label className="lbl">Topic *</label><select className="inp" style={{appearance:"none"}} value={form.topic} onChange={e=>setForm(f=>({...f,topic:e.target.value,subtopic:""}))} disabled={!form.chapter}><option value="">-- Select Topic --</option>{chTps.map(t=><option key={t.name} value={t.name}>{t.name}</option>)}</select></div>
          <div style={{marginBottom:14}}><label className="lbl">Sub-topic (optional)</label><select className="inp" style={{appearance:"none"}} value={form.subtopic} onChange={e=>setForm(f=>({...f,subtopic:e.target.value}))} disabled={!form.topic}><option value="">-- Select Sub-topic --</option>{tpSts.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
          <div className="g2" style={{marginBottom:14}}>
            <div><label className="lbl">Duration (min)</label><input className="inp" type="number" min={10} max={120} value={form.duration} onChange={e=>setForm(f=>({...f,duration:+e.target.value}))}/></div>
            <div><label className="lbl">Logged by</label><input className="inp" value={profile?.name||"Teacher"} disabled style={{background:"#f8fafc",color:"#64748b"}}/></div>
          </div>
          <div style={{marginBottom:16}}><label className="lbl">Class Notes / Observations</label><textarea className="inp" rows={3} placeholder="What was covered? Any observations? Homework given?" value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} style={{resize:"vertical"}}/></div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn bo" style={{flex:1}} onClick={addEntry} disabled={!form.subject||!form.chapter||!form.topic}>+ Add Another</button>
            <button className="btn bp" style={{flex:1}} onClick={submit} disabled={!form.subject||!form.chapter||!form.topic||saving}>{saving?"Saving...":"Save "+(entries.length>0?`All (${entries.length+1})`:"Topic")}</button>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:16}}>
          {entries.length>0&&(
            <div className="card">
              <div className="st">📋 Queued ({entries.length})</div>
              {entries.map(e=>(
                <div key={e.id} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",borderRadius:8,background:"#f8fafc",border:"1px solid #e2e8f0",marginBottom:8}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:e.status==="taught"?"#276221":"#9C0006",flexShrink:0,marginTop:4}}/>
                  <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{e.subject}</div><div style={{fontSize:12,color:"#64748b"}}>{e.chapter} → {e.topic}{e.subtopic?" → "+e.subtopic:""}</div>{e.notes&&<div style={{fontSize:11,color:"#94a3b8",marginTop:2,fontStyle:"italic"}}>{e.notes.slice(0,50)}...</div>}</div>
                  <button onClick={()=>setEntries(p=>p.filter(x=>x.id!==e.id))} style={{background:"none",border:"none",cursor:"pointer",color:"#9C0006",fontSize:14}}>✕</button>
                </div>
              ))}
              <button className="btn bp bfw" style={{marginTop:8}} onClick={submit}>Save All {entries.length} Entries</button>
            </div>
          )}
          <div className="card" style={{background:"linear-gradient(135deg,#1F4E79,#2E75B6)",color:"white"}}>
            <div style={{fontSize:15,fontWeight:700,marginBottom:10}}>How It Works</div>
            <div style={{fontSize:13,lineHeight:1.8,opacity:.9}}>1. Select Subject<br/>2. Chapter auto-loads<br/>3. Topic auto-loads<br/>4. Sub-topic auto-loads<br/>5. Add class notes<br/>6. Save — progress updates instantly<br/>7. Revision set for 7 days later</div>
          </div>
          <div className="card">
            <div className="st">Today Timetable</div>
            {(()=>{const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];const tn=days[new Date().getDay()];const TT={Monday:["English","Odia","Maths","SST","Science","GK","Games","Yoga"],Tuesday:["English","Hindi","Maths","Science","SST","Odia","Art","CSPD"],Wednesday:["English","Maths","Science","Hindi","Odia","SST","Music","GK"],Thursday:["English","Science","SST","Maths","Hindi","Maths Lab","Comp Lab","Dance"],Friday:["English","GK","Hindi","Odia","Maths","Science","SST","Library"],Saturday:["English","SST","Odia","Science","Maths","Hindi","Comp","Art"]};const subs=TT[tn]||[];return subs.length>0?<div style={{display:"flex",flexWrap:"wrap",gap:6}}>{subs.map((s,i)=><span key={i} style={{padding:"4px 10px",borderRadius:9999,fontSize:12,fontWeight:600,background:"#DCE6F1",color:"#1F4E79"}}>P{i+1}: {s}</span>)}</div>:<p style={{fontSize:13,color:"#64748b"}}>No school today</p>;})()}
          </div>
        </div>
      </div>
    </div>
  );
}
